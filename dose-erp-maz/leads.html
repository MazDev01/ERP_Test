<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ผู้สนใจ — ERP MAZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --maz-red:#D0021B; --maz-red-deep:#8E0012; --maz-red-bright:#E8253C;
  --ink:#1F2430; --ink-soft:#68707E; --ink-faint:#9AA1AE;
  --line:#E8EBF0; --field:#FAFBFC; --white:#FFF;
  --lead:#1F6FD0; --lead-bg:#E8F1FC;
  --cust:#14875A; --cust-bg:#E7F5EE;
  --off:#8A919E;  --off-bg:#F1F3F6;
  --late:#C0121F; --late-bg:#FDECEE;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--ink);background:#F4F5F8;display:flex}

.side{
  width:228px;flex:none;color:var(--white);position:relative;
  background:linear-gradient(170deg,var(--maz-red-bright),var(--maz-red) 42%,var(--maz-red-deep));
  display:flex;flex-direction:column;padding:24px 0 18px;
}
.side::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,transparent 1px 44px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 1px,transparent 1px 44px);
  mask-image:linear-gradient(160deg,rgba(0,0,0,1) 8%,rgba(0,0,0,.3) 80%);
  -webkit-mask-image:linear-gradient(160deg,rgba(0,0,0,1) 8%,rgba(0,0,0,.3) 80%);
}
.side > *{position:relative;z-index:1}
.logo{padding:0 24px 18px;font-size:21px;font-weight:700;letter-spacing:.05em;flex:none}
.nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:0 12px 12px;scrollbar-width:thin}
.grp{padding:12px 20px 5px;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.55)}
.grp:first-child{padding-top:0}

.nav a{display:flex;align-items:center;gap:11px;padding:8px 13px;border-radius:10px;color:rgba(255,255,255,.82);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.12);color:var(--white)}
.nav a.on{background:var(--white);color:var(--maz-red);font-weight:600}
.nav svg{flex:none}

/* แถบหัวมาตรฐาน — ใช้เหมือนกันทุกหน้า */
.appbar{
  flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:11px 26px;background:var(--white);border-bottom:1px solid var(--line);
}
.appbar .where{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;min-width:0}
.appbar .where svg{color:var(--ink-faint);flex:none}
.appbar .side-tools{display:flex;align-items:center;gap:9px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--white);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none}
.iconbtn:hover{border-color:var(--ink-faint);color:var(--ink)}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--maz-red);border:1.5px solid var(--white)}

.me{display:flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--white);cursor:pointer;font-family:inherit;flex:none}
.me:hover{border-color:var(--maz-red)}
.me .av{width:30px;height:30px;border-radius:50%;background:#FCEBEE;color:var(--maz-red);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.mehead{display:flex;align-items:center;gap:11px;padding:8px 10px 10px}
.mehead .av{width:40px;height:40px;border-radius:50%;background:#FCEBEE;color:var(--maz-red);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.mehead .tx{min-width:0}
.mehead .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mehead .tx span{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.menu{
  position:absolute;top:50px;right:26px;z-index:60;width:236px;
  background:var(--white);border:1px solid var(--line);border-radius:13px;
  box-shadow:0 18px 40px -18px rgba(60,20,30,.34);padding:6px;
  opacity:0;visibility:hidden;transform:translateY(-6px);
  transition:opacity .18s,transform .18s,visibility .18s;
}
.menu.on{opacity:1;visibility:visible;transform:none}
.menu a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13px;color:var(--ink);text-decoration:none}
.menu a:hover{background:#FDECEE;color:var(--maz-red)}
.menu a.out{color:var(--maz-red)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 4px}
.main{position:relative;flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 30px 0}
.bar h1{font-size:24px;font-weight:700}
.bar p{margin-top:3px;font-size:13.5px;color:var(--ink-soft)}
.tools{display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:9px;height:38px;padding:0 14px;background:var(--white);border:1px solid var(--line);border-radius:10px;color:var(--ink-faint);font-size:13.5px;min-width:250px}
.search input{border:none;background:none;outline:none;font-family:inherit;font-size:13.5px;color:var(--ink);width:100%}
.search input::placeholder{color:var(--ink-faint)}
.search:focus-within{border-color:var(--maz-red);box-shadow:0 0 0 3px rgba(208,2,27,.09)}
.add{height:38px;padding:0 18px;border:none;border-radius:10px;cursor:pointer;background:linear-gradient(100deg,var(--maz-red-bright),var(--maz-red-deep));color:var(--white);font-family:inherit;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}

.panel{margin:18px 30px 22px;background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
.strip{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:none;cursor:pointer;font-family:inherit;padding:14px 14px 12px;font-size:13.5px;font-weight:500;color:var(--ink-soft);border-bottom:2.5px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--maz-red);border-bottom-color:var(--maz-red);font-weight:600}
.tabs button b{margin-left:6px;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:9px;background:var(--field);color:var(--ink-faint)}
.tabs button.on b{background:#FCEBEE;color:var(--maz-red)}
.filters{display:flex;align-items:center;gap:8px;padding:8px 0}
.chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--white);font-family:inherit;font-size:12.5px;color:var(--ink-soft);cursor:pointer}
.chip.on{border-color:var(--maz-red);color:var(--maz-red);background:#FEF5F6;font-weight:600}

.scroll{flex:1;min-height:0;overflow:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{position:sticky;top:0;background:var(--white);z-index:2}
th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-faint);padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:13px 14px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .12s}
/* ชี้แถวไหนต้องรู้ทันทีว่ากำลังชี้รายนั้น ใช้ .panel นำหน้าให้ชนะกฎในบล็อกธีมกระจก */
.panel tbody tr td{position:relative;transition:background .14s}
.panel tbody tr:hover td{background:rgba(208,2,27,.055)}
.panel tbody tr:hover td:first-child{box-shadow:inset 3px 0 0 var(--maz-red)}

tbody tr.sel{background:linear-gradient(100deg,var(--maz-red-bright),var(--maz-red-deep));color:var(--white)}
tbody tr.sel td{border-bottom-color:transparent}
tbody tr.sel .muted{color:rgba(255,255,255,.75)}
tbody tr:last-child td{border-bottom:none}
.who-cell{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:30px;height:30px;border-radius:50%;flex:none;background:#FCEBEE;color:var(--maz-red);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600}
tr.sel .av{background:rgba(255,255,255,.22);color:var(--white)}
.who-cell b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ink-soft);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.t-lead{background:var(--lead-bg);color:var(--lead)}
.t-cust{background:var(--cust-bg);color:var(--cust)}
.t-off{background:var(--off-bg);color:var(--off)}
tr.sel .tag{background:rgba(255,255,255,.2);color:var(--white)}
.late{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:2px 8px;border-radius:16px;font-size:11px;font-weight:600;background:var(--late-bg);color:var(--late);white-space:nowrap}
tr.sel .late{background:rgba(255,255,255,.22);color:var(--white)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.act{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--white);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer}
.act:hover{border-color:var(--ink-faint);color:var(--ink)}
tr.sel .act{background:rgba(255,255,255,.18);border-color:transparent;color:var(--white)}
.d-no{background:var(--late-bg);color:var(--late)}
.d-no:hover{filter:brightness(.97)}

.box.bad select{border-color:var(--late);background:#FEF6F7}
.box .row3{display:flex;gap:10px;margin-top:20px}
.box .row3 button{flex:1;height:46px;border-radius:23px;border:none;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:600}
.box .cancel{background:#F1F3F7;color:var(--ink-soft)}
.box .go{background:linear-gradient(100deg,#D8323F,#96101C);color:var(--white)}

.empty{padding:54px 20px;text-align:center;color:var(--ink-faint);font-size:14px}

.foot{flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;font-size:13px;color:var(--ink-soft)}
.pages{display:flex;gap:5px}
.pages button{min-width:31px;height:31px;padding:0 8px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--white);font-family:inherit;font-size:13px;color:var(--ink-soft)}
.pages button.on{background:var(--maz-red);border-color:var(--maz-red);color:var(--white);font-weight:600}

.d-main{background:linear-gradient(100deg,var(--maz-red-bright),var(--maz-red-deep));color:var(--white)}
.d-ghost{background:#F1F3F7;color:var(--ink-soft)}
.x{border:none;background:none;cursor:pointer;color:var(--ink-faint);display:flex;padding:4px}

:focus-visible{outline:2.5px solid var(--maz-red);outline-offset:3px}
@media (max-width:1180px){
  .side{width:74px}
  .logo{padding:0 0 22px;text-align:center;font-size:17px}
  .nav a span,.grp{display:none}
  .nav a{justify-content:center;padding:12px 0}
  th.hide,td.hide{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- กล่องบันทึกการติดต่อ ---------- */
.lgveil{position:fixed;inset:0;z-index:120;background:rgba(28,20,45,.45);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
.lgveil.on{opacity:1;visibility:visible}
.lgbox{width:100%;max-width:520px;max-height:100%;display:flex;flex-direction:column;border-radius:18px;background:var(--white);border:1px solid var(--line);overflow:hidden}
.lghead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line)}
.lghead h3{font-size:16px;font-weight:700}
.lgx{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--white);color:var(--ink-faint);cursor:pointer;display:flex;align-items:center;justify-content:center}
.lgx:hover{color:var(--maz-red);border-color:var(--maz-red)}
.lgbody{flex:1;min-height:0;overflow:auto;padding:18px 20px}
.lgfoot{flex:none;display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line)}
.lgf{margin-bottom:15px}
.lgf:last-child{margin-bottom:0}
.lgf label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.lgf label em{font-style:normal;color:var(--maz-red);margin-left:2px}
.lgf input,.lgf textarea{width:100%;height:38px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-family:inherit;font-size:13.5px;color:var(--ink)}
.lgf textarea{height:84px;padding:9px 11px;resize:vertical;line-height:1.55}
.lgf input.bad,.lgf textarea.bad{border-color:var(--late);background:var(--late-bg)}
.lgseg{display:flex;flex-wrap:wrap;gap:6px}
.lgseg button{height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--white);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink-soft)}
.lgseg button.on{border-color:var(--maz-red);background:#FEF5F6;color:var(--maz-red);font-weight:600}
.lgmsg{display:none;margin-top:12px;font-size:12.5px;color:var(--late)}

/* ตัวเลือกที่ถูกเลือกอยู่ในดรอปดาวน์ เป็นสีชมพูอ่อน */
select option:checked{
  background:#FDECEE linear-gradient(0deg,#FDECEE,#FDECEE);
  color:var(--maz-red);font-weight:600}
/* ================= glass theme ================= */
body{background:#F2F3F7}
body::before{
  content:'';position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38% 42% at 78% 6%,  rgba(255,64,92,.34),  transparent 68%),
    radial-gradient(34% 40% at 12% 18%, rgba(255,140,90,.26), transparent 66%),
    radial-gradient(42% 44% at 62% 88%, rgba(96,132,255,.28), transparent 68%),
    radial-gradient(36% 40% at 18% 82%, rgba(120,220,200,.24),transparent 66%),
    radial-gradient(30% 34% at 92% 60%, rgba(196,120,255,.22),transparent 66%),
    #F4F5F9;
  filter:blur(40px);
}
/* ชั้นฝ้าบางๆ ให้สีไม่จัดเกินและตัวหนังสืออ่านง่าย */
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:rgba(255,255,255,.34);
}

/* ---- พื้นผิวกระจก ---- */
.panel, .card, .kpi, .pcard, .revcard, .box, .edu-wrap{
  background:rgba(255,255,255,.46);
  backdrop-filter:blur(30px) saturate(190%);
  -webkit-backdrop-filter:blur(30px) saturate(190%);
  border:1px solid rgba(255,255,255,.58);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -1px 0 rgba(255,255,255,.28),
    0 1px 2px rgba(28,20,45,.05),
    0 18px 40px -20px rgba(40,25,60,.30);
}
.appbar, .topbar{
  background:rgba(255,255,255,.52);
  backdrop-filter:blur(26px) saturate(190%);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  border-bottom:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 8px 26px -20px rgba(40,25,60,.5);
}
.menu{
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(34px) saturate(200%);
  -webkit-backdrop-filter:blur(34px) saturate(200%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 26px 54px -24px rgba(40,25,60,.45);
}
.search, .seg, .mo, .iconbtn, .me, .btn.ghost, .chip, .drop, .master, .opt, .pages button, .tabs, .sw{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(255,255,255,.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
.iconbtn:hover, .me:hover, .btn.ghost:hover, .chip:hover{background:rgba(255,255,255,.72)}
.chip.on, .opt.on, .seg button.on, .pages button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

/* ปุ่มหลักเป็นแก้วสีแดง ไม่ใช่สีทึบ */
.btn.solid, .add, .solid{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 12px 26px -12px rgba(208,2,27,.6);
}

/* ตารางโปร่ง เห็นชั้นสีด้านหลัง */
thead th{background:rgba(255,255,255,.62)!important;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
tbody tr:hover{background:rgba(255,255,255,.42)}
tr.sub td{background:rgba(255,255,255,.34)}
table.rounds, table.revs, table.inner{background:rgba(255,255,255,.5)}

/* ช่องกรอกทึบกว่าเล็กน้อยเพื่อให้อ่านง่าย */
input, select, textarea{
  background:rgba(255,255,255,.58);
  border-color:rgba(255,255,255,.7);
  box-shadow:inset 0 1px 2px rgba(40,25,60,.05);
}
input:hover, select:hover, textarea:hover{background:rgba(255,255,255,.72)}
input:focus, select:focus, textarea:focus{background:rgba(255,255,255,.92)}
input:disabled, input[readonly]{background:rgba(240,241,245,.62)}

/* กระดาษเอกสารต้องทึบ เพราะต้องพิมพ์จริง */
.paper{
  background:#FFF;backdrop-filter:none;-webkit-backdrop-filter:none;
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 2px 8px rgba(28,20,45,.06), 0 30px 66px -30px rgba(40,25,60,.45);
}

@supports not (backdrop-filter: blur(2px)){
  body::before{filter:none;opacity:.5}
  .panel,.card,.kpi,.pcard,.revcard,.box,.edu-wrap,.menu,.appbar,.topbar{background:rgba(255,255,255,.94)}
}
@media print{ body::before,body::after{display:none} }

/* ===== glass theme — ส่วนเพิ่ม (ใช้ร่วมทุกหน้า) ===== */
/* บล็อกด้านบนคลุมแค่ .panel .card .menu .appbar ฯลฯ ส่วนนี้เก็บของที่ตกสำรวจ
   ห้ามเขียน CSS ของหน้าไว้ใต้บล็อกนี้ ไม่งั้นจะไปทับธีมกระจก */

/* กล่องที่ลอยทับเนื้อหา ต้องทึบกว่าการ์ดพื้นหลัง ไม่งั้นตารางด้านหลังทะลุจนอ่านไม่ออก */
.drawer, .list, .tip, /* เมนูบัญชีลอยทับเนื้อหา ถ้าโปร่งจะเห็นข้อความข้างหลังทะลุจนอ่านยาก ต้องทึบ */
.menu{
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-color:rgba(31,36,48,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 26px 54px -24px rgba(40,25,60,.45);
}
.cal, .tpop{
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(34px) saturate(200%);
  -webkit-backdrop-filter:blur(34px) saturate(200%);
  border-color:rgba(255,255,255,.8);
}
.box{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(36px) saturate(200%);
  -webkit-backdrop-filter:blur(36px) saturate(200%);
  border-color:rgba(255,255,255,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 34px 70px -28px rgba(40,25,60,.5);
}

/* ปุ่มเล็กในตารางและแถบเครื่องมือ ให้เป็นแก้วระดับเดียวกับ .iconbtn */
.act, .del, .mini, .more, .calbar button, .file .rm, .b-line, .pick, .calnav, .tcol .val{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(255,255,255,.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
/* ไม่ใส่ .del:hover เพราะหน้าใบเสนอราคากำหนดพื้นแดงอ่อนตอน hover ไว้แล้ว */
.act:hover, .mini:hover, .more:hover, .calbar button:hover, .file .rm:hover, .b-line:hover, .pick:hover, .calnav:hover{
  background:rgba(255,255,255,.76);
}

/* ปฏิทินไทยและตัวเลือกเวลาแบบ stepper (หน้าการลา) */
.calgrid button:hover{background:rgba(31,36,48,.06)}
.calgrid button.on:hover{background:var(--maz-red)}
.tcol .step:hover:not(:disabled){background:rgba(31,36,48,.06)}
.card .track{background:rgba(31,36,48,.13)}
.calc{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(31,36,48,.09);
}
.bhead, .bfoot{border-color:rgba(31,36,48,.09)}

/* กล่องไฟล์แนบ */
.file{
  background:rgba(255,255,255,.42);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(255,255,255,.6);
}

/* หน้าเข้าสู่ระบบ */
.shell, .formside, .scoop{
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(30px) saturate(190%);
  -webkit-backdrop-filter:blur(30px) saturate(190%);
}

/* ตัวเครื่องในหน้าตัวอย่างสถานะบัญชี เป็นภาพจำลองมือถือ ต้องทึบ ไม่ใส่กระจก */

@supports not (backdrop-filter: blur(2px)){
  .drawer,.list,.tip,.cal,.tpop,.box{background:rgba(255,255,255,.98)}
  .shell,.formside,.scoop{background:rgba(255,255,255,.96)}
}

/* ===== เลื่อนทั้งคอลัมน์เนื้อหาเป็นก้อนเดียว ไม่เลื่อนในตาราง (ใช้ร่วมทุกหน้า) ===== */
/* เดิมตารางมีสกรอลล์ของตัวเองซ้อนอยู่ข้างใน เอาออกให้เลื่อนทีเดียวทั้งคอลัมน์
   ตัวที่เลื่อนคือ .main ไม่ใช่ทั้งหน้า เมนูซ้ายเลยอยู่กับที่เสมอ ไม่ต้องพึ่ง sticky
   (ถ้าให้ทั้งหน้ายาวแล้วใช้ sticky เมนูจะหายตอนเลื่อนในกรอบพรีวิวที่สูงเท่าเนื้อหา) */
/* ต้องระบุ main.main เพราะมีปุ่มที่ใช้คลาส main ด้วย ถ้าเขียน .main เฉยๆ ปุ่มจะสูงเท่าจอ */
main.main{height:100vh;overflow:auto}
.panel{flex:none}
.scroll, .scrollarea, .stage{flex:none;min-height:0;overflow:visible}
/* ยกเว้นดรอปดาวน์ค้นหา ต้องเลื่อนในกล่องตัวเองเหมือนเดิม */
.list .scrollarea{max-height:264px;overflow:auto}
/* แถบหัวลอยอยู่บนสุดของคอลัมน์เนื้อหา และต้องทึบพอให้อ่านออกตอนเนื้อหาเลื่อนลอดใต้ */
.appbar, .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86)}
/* แผงเลื่อนข้างและกล่องซ้อนยังเลื่อนในตัวเองตามเดิม */
.drawer .body, .bbody{overflow:auto}
@media print{ .appbar, .topbar{position:static} .main{height:auto;overflow:visible} }

.twrap input.bad, .dwrap input.bad{
  border-color:var(--late);
  background:var(--late-bg);
  color:var(--late);
  font-weight:600;
}
.twrap input.bad ~ .clockbtn, .dwrap input.bad ~ .calbtn{color:var(--late)}

/* ===== มือถือ: ตารางรายการเปลี่ยนเป็นการ์ดต่อแถว (ใช้ร่วมทุกหน้า) =====
   จอ 640px ลงมา ตารางหลายคอลัมน์อ่านยากมากถ้าเลื่อนแนวนอน
   จึงพับแต่ละแถวเป็นการ์ด โดยเอาชื่อคอลัมน์จาก th มาไว้หน้าเซลล์
   ใช้เฉพาะตารางรายการ (.scroll > table) ไม่แตะตารางในเอกสาร A4 หรือตารางกรอกในฟอร์ม */
@media (max-width:640px){
  /* ตารางที่แปลงเป็นการ์ดจะแคบพอดีอยู่แล้ว ส่วนตารางกรอกในฟอร์มยังกว้าง ต้องเลื่อนข้างได้
     ถ้าตั้ง visible เนื้อหาจะถูกตัดหายโดยไม่มีทางเลื่อนไปดู */
  .scroll{overflow-x:auto}
  .scroll > table.grid{min-width:760px}
  .scroll > table:not(.grid){min-width:0!important;display:block;border-collapse:separate;border-spacing:0}
  .scroll > table:not(.grid) > thead{display:none}
  .scroll > table:not(.grid) > tbody{display:block}

  .scroll > table:not(.grid) > tbody > tr{
    display:block;margin:10px 14px;padding:6px 2px;
    border:1px solid var(--line);border-radius:13px;background:var(--white);
  }
  .scroll > table:not(.grid) > tbody > tr > td{
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    width:auto;border:none;padding:7px 13px;text-align:right;
  }
  .scroll > table:not(.grid) > tbody > tr > td::before{
    content:attr(data-label);flex:none;max-width:44%;
    color:var(--ink-faint);font-size:12px;font-weight:600;text-align:left;line-height:1.5;
  }
  .scroll > table:not(.grid) > tbody > tr > td:not([data-label])::before{content:none}
  .scroll > table:not(.grid) > tbody > tr > td > *{text-align:right}
  .scroll > table:not(.grid) > tbody > tr > td .clip{white-space:normal}

  /* แถวว่างและแถวที่กางรายละเอียดคร่อมทั้งแถว ให้แสดงเต็มความกว้างตามเดิม */
  .scroll > table:not(.grid) > tbody > tr.sub{margin:0;padding:0;border:none;border-radius:0;background:none}
  .scroll > table:not(.grid) > tbody > tr.sub > td{display:block;text-align:left;padding:0}
  .scroll > table:not(.grid) > tbody > tr.sub > td::before{content:none}
  .scroll > table:not(.grid) > tbody > tr > td.blank,
  .scroll > table:not(.grid) > tbody > tr > td.empty{display:block;text-align:center}
  .scroll > table:not(.grid) > tbody > tr > td.blank::before,
  .scroll > table:not(.grid) > tbody > tr > td.empty::before{content:none}

  /* ตารางย่อยข้างในการ์ดยังเป็นตารางปกติ แต่ให้เลื่อนข้างได้ */
  .subwrap{overflow-x:auto}
  table.inner{min-width:560px}


  /* แถบหัวหน้า: ชื่อหน้ากับปุ่มเครื่องมือไม่พอในบรรทัดเดียว ต้องตกบรรทัดแทนการถูกตัดหาย */
  .bar{flex-wrap:wrap;gap:12px}
  .bar .tools{width:100%;flex-wrap:wrap;justify-content:flex-start;gap:9px}
  .bar .tools .mo{flex:1 1 auto;min-width:0;justify-content:space-between}
  .bar .tools .btn, .bar .tools .seg{flex:1 1 auto;justify-content:center}
  .bar h1{font-size:20px}

  /* กริดที่ตั้งความกว้างคอลัมน์เป็นพิกเซลตายตัวไว้ ต้องบีบให้พอดีจอ ไม่งั้นลูกล้นออกไป */
  .shell{grid-template-columns:minmax(0,1fr)!important;max-width:100%!important}
  .pcard, .scoop{max-width:100%!important;width:auto!important;min-width:0}
  .profile{grid-template-columns:1fr!important}
  .facts{grid-template-columns:1fr!important}
  .two, .two-up, .wide-left, .moneygrid{grid-template-columns:1fr!important}

  /* ตารางอื่นที่ไม่ได้อยู่ในกรอบเลื่อน ต้องมีกรอบเลื่อนของตัวเอง */
  .pcard table, .card table{display:block;overflow-x:auto;max-width:100%}

  /* ช่องค้นหาและแถวป้าย-ค่า ตั้งความกว้างตายตัวไว้ ต้องยืดหดตามจอ */
  .search{width:100%!important;min-width:0}
  .search input{width:100%;min-width:0}
  .mrow{flex-wrap:wrap;gap:4px 10px}
  .mrow > span, .mrow > label{width:auto;min-width:120px}
  .card, .panel{min-width:0}

  /* ปุ่มยาวๆ อย่างส่งออก Excel และแถวปุ่มด้านขวาให้ตกบรรทัด ไม่ดันออกนอกจอ */
  .right, .acts, .btnrow{flex-wrap:wrap}
  .btn{white-space:nowrap}
  .bars .bar{max-width:100%}

  /* แถบเลขหน้าและปุ่มสาธิตให้ตกบรรทัดแทนที่จะดันออกนอกจอ */
  .pages{flex-wrap:wrap;justify-content:center}
  .foot{flex-wrap:wrap;gap:10px}
  .demo{flex-wrap:wrap;justify-content:center}

  /* ตารางกรอกในกล่องซ้อน ให้เลื่อนข้างในกล่องแทนที่จะดันกล่องล้นจอ */
  .bbody{overflow-x:auto}
  .bbody table.grid{min-width:420px}

  /* แท็บบนมือถือให้เลื่อนแนวนอนแทนที่จะตกบรรทัด */
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none}
  .strip{flex-wrap:wrap;gap:8px}
  .legend{display:none}
}

/* ===== แท็บเล็ต: กล่องที่ตั้งความกว้างเป็นพิกเซลตายตัวต้องยืดหดตามจอด้วย ===== */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)!important;max-width:100%!important}
  .pcard, .scoop{max-width:100%!important;width:auto!important;min-width:0}
  .pcard table, .card table{display:block;overflow-x:auto;max-width:100%}
}
/* ===== จอแคบมาก: การ์ดสรุปเรียงลงคอลัมน์เดียว ===== */
@media (max-width:420px){
  .cards{grid-template-columns:minmax(0,1fr)!important}
  .cards > *{min-width:0}
  /* กริดหลายคอลัมน์ในแดชบอร์ดเหลือคอลัมน์เดียว ไม่งั้นคอลัมน์กว้างเกินจอ */
  .grid, .grid2, .grid3{grid-template-columns:minmax(0,1fr)!important}
  .grid > *, .grid2 > *, .grid3 > *{min-width:0}
}

/* ===== มือถือ: เปลี่ยนเมนูข้างเป็นแถบล่าง ===== */
.botnav{display:none}
.bnsheet{display:none}
@media (max-width:640px){
  /* ซ่อนแถบข้าง ใช้แถบล่างแทน เพราะนิ้วโป้งเอื้อมถึงง่ายกว่า */
  .side{display:none!important}
  main.main{margin-left:0!important;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
  body{padding-bottom:0}

  .botnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:90;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    border-top:1px solid rgba(31,36,48,.09);
    box-shadow:0 -6px 22px -14px rgba(40,25,60,.35);
  }
  .bn-i{
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:6px 2px;border:none;background:none;cursor:pointer;text-decoration:none;
    font-family:inherit;color:var(--ink-faint);border-radius:12px;
  }
  .bn-i svg{width:21px;height:21px;flex:none}
  .bn-i span{font-size:10.5px;font-weight:600;line-height:1.25;text-align:center;
             max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bn-i.on{color:var(--maz-red)}
  .bn-i.on svg{stroke-width:2.1}
  .bn-i:active{background:rgba(208,2,27,.07)}

  /* แผ่นเมนูทั้งหมด เลื่อนขึ้นจากด้านล่าง */
  .bnsheet{
    display:block;position:fixed;inset:0;z-index:95;
    background:rgba(28,20,45,.42);
    opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;
  }
  .bnsheet.on{opacity:1;visibility:visible}
  .bnpanel{
    position:absolute;left:0;right:0;bottom:0;
    background:var(--white);border-radius:20px 20px 0 0;
    padding:10px 16px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(14px);transition:transform .22s;
    max-height:78vh;overflow:auto;
  }
  .bnsheet.on .bnpanel{transform:translateY(0)}
  .bngrab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
  .bntitle{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;padding-left:4px}
  .bnlist{display:flex;flex-direction:column}
  .bnrow{
    display:flex;align-items:center;gap:13px;padding:13px 12px;border-radius:12px;
    text-decoration:none;color:var(--ink);font-size:14.5px;font-weight:500;
  }
  .bnrow svg{width:19px;height:19px;flex:none;color:var(--ink-faint)}
  .bnrow.on{background:#FEF5F6;color:var(--maz-red);font-weight:700}
  .bnrow.on svg{color:var(--maz-red)}
  .bnrow:active{background:var(--field)}
}

    e.stopPropagation();
    var open=!meMenu.classList.contains('on');
    meMenu.classList.toggle('on',open);
    meBtn.setAttribute('aria-expanded', open?'true':'false');
  });
  document.addEventListener('click', function(e){ if(!meMenu.contains(e.target)) closeMe(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeMe(); });
})();
</script>
<!-- ===== ตารางเป็นการ์ดบนมือถือ (ใส่ร่วมทุกหน้าโดย apply_glass.py) ===== -->
<script>
(function(){
  // บนจอแคบตารางถูกจัดใหม่เป็นการ์ด แต่ละเซลล์ต้องมีป้ายชื่อคอลัมน์ของตัวเอง
  // เพราะหัวตารางถูกซ่อน จึงคัดชื่อจาก th มาใส่เป็น data-label ให้ทุก td
  function label(t){
    var ths = t.querySelectorAll(':scope > thead > tr > th');
    if(!ths.length) return;
    var rows = t.querySelectorAll(':scope > tbody > tr');
    Array.prototype.forEach.call(rows, function(tr){
      if(tr.classList.contains('sub')) return;          // แถวที่กางรายละเอียดคร่อมทั้งแถว ไม่ต้องมีป้าย
      Array.prototype.forEach.call(tr.children, function(td, i){
        if(!ths[i]) return;
        var txt = ths[i].textContent.trim();
        if(txt) td.setAttribute('data-label', txt);
        else td.removeAttribute('data-label');
      });
    });
  }
  function run(){
    Array.prototype.forEach.call(document.querySelectorAll('.scroll > table'), label);
  }
  run();
  // ตารางถูกวาดใหม่ด้วย JS ตลอด ต้องติดป้ายใหม่ทุกครั้งที่แถวเปลี่ยน
  if(window.MutationObserver){
    var mo = new MutationObserver(run);
    Array.prototype.forEach.call(document.querySelectorAll('.scroll > table > tbody'), function(tb){
      mo.observe(tb, {childList:true});
    });
  }
})();
</script>

<!-- ===== แถบเมนูล่างบนมือถือ (ใส่ร่วมทุกหน้าโดย apply_glass.py) ===== -->
<script>
(function(){
  var side = document.querySelector('.side .nav');
  if(!side) return;

  var links = Array.prototype.slice.call(side.querySelectorAll('a'));
  if(!links.length) return;

  // เอา 4 เมนูแรกขึ้นแถบล่าง ที่เหลือไปอยู่ในปุ่ม "อื่นๆ"
  var MAIN = 4;
  var main = links.slice(0, MAIN), rest = links.slice(MAIN);

  function iconOf(a){
    var svg = a.querySelector('svg');
    return svg ? svg.outerHTML : '';
  }
  function labelOf(a){
    var s = a.querySelector('span');
    return s ? s.textContent.trim() : a.textContent.trim();
  }

  var bn = document.createElement('nav');
  bn.className = 'botnav';
  bn.setAttribute('aria-label','เมนูหลัก');

  bn.innerHTML = main.map(function(a){
    return '<a href="'+a.getAttribute('href')+'" class="bn-i'+(a.classList.contains('on')?' on':'')+'">'+
      iconOf(a)+'<span>'+labelOf(a)+'</span></a>';
  }).join('') +
  (rest.length
    ? '<button type="button" class="bn-i" id="bnMore" aria-haspopup="true" aria-expanded="false">'+
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'+
      '<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/>'+
      '<circle cx="19" cy="12" r="1.4" fill="currentColor"/></svg><span>อื่นๆ</span></button>'
    : '');
  document.body.appendChild(bn);

  if(rest.length){
    var sheet = document.createElement('div');
    sheet.className = 'bnsheet';
    sheet.innerHTML =
      '<div class="bnpanel" role="menu">'+
        '<div class="bngrab"></div>'+
        '<p class="bntitle">เมนูทั้งหมด</p>'+
        '<div class="bnlist">'+
          links.map(function(a){
            return '<a href="'+a.getAttribute('href')+'" class="bnrow'+(a.classList.contains('on')?' on':'')+'" role="menuitem">'+
              iconOf(a)+'<span>'+labelOf(a)+'</span></a>';
          }).join('')+
        '</div>'+
      '</div>';
    document.body.appendChild(sheet);

    var moreBtn = document.getElementById('bnMore');
    function open(){ sheet.classList.add('on'); moreBtn.setAttribute('aria-expanded','true'); }
    function close(){ sheet.classList.remove('on'); moreBtn.setAttribute('aria-expanded','false'); }
    moreBtn.addEventListener('click', function(e){ e.stopPropagation(); sheet.classList.contains('on')?close():open(); });
    sheet.addEventListener('click', function(e){ if(e.target===sheet) close(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
    // ถ้าเมนูที่กำลังเปิดอยู่ไม่ได้อยู่ใน 4 อันแรก ให้ปุ่มอื่นๆ ติดสถานะแทน
    if(rest.some(function(a){ return a.classList.contains('on'); })) moreBtn.classList.add('on');
  }
})();
</script>
