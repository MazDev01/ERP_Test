<script>
/* มือถือของพนักงาน: สร้างเมนูแคปซูลและการ์ดหน้าหลักจากเมนูแถบข้าง จึงตรงกับเมนูของแต่ละบทบาทเสมอ */
(function(){
  var links=Array.prototype.slice.call(document.querySelectorAll('.side .nav a'));
  function label(a){ var s=a.querySelector('span'); return (s?s.textContent:a.textContent).replace(/^\s+|\s+$/g,''); }
  function icon(a){ var s=a.querySelector('svg'); return s?s.outerHTML:''; }
  var cur=null;
  links.forEach(function(a){ if(a.classList.contains('on')) cur=a; });
  function escA(s){ return String(s).replace(/"/g,'&quot;'); }

  // ---------- ปุ่มแคปซูลสลับเมนู ----------
  // ปุ่มแคปซูลมีเฉพาะหน้าข้างใน การ์ดเมนูมีเฉพาะหน้าหลัก จึงหาด้วย class และข้ามถ้าไม่มี
  var pill=document.querySelector('.mh-pill'), pmenu=document.querySelector('.mh-pmenu');
  if(pill && pmenu){
    pill.querySelector('span').textContent=cur?label(cur):'เมนู';
    pmenu.innerHTML=links.map(function(a){
      var on=a===cur;
      return '<li><a href="'+escA(a.getAttribute('href'))+'"'+(on?' class="on" aria-current="page"':'')+'>'+icon(a)+'<span>'+label(a)+'</span></a></li>';
    }).join('');
    var openP=function(){ pmenu.classList.add('on'); pill.setAttribute('aria-expanded','true'); };
    var closeP=function(){ pmenu.classList.remove('on'); pill.setAttribute('aria-expanded','false'); };
    pill.addEventListener('click', function(ev){ ev.stopPropagation(); pmenu.classList.contains('on')?closeP():openP(); });
    document.addEventListener('click', function(ev){ if(!pmenu.contains(ev.target)) closeP(); });
    document.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && pmenu.classList.contains('on')){ closeP(); pill.focus(); } });
  }

  // ---------- การ์ดเมนูหน้าหลัก ----------
  var BIG={
    'my-tasks.html':'<rect x="11" y="9" width="26" height="33" rx="4" fill="#F9DEE2" stroke="#2B2438" stroke-width="1.8"/><rect x="18" y="5.5" width="12" height="7" rx="2" fill="#FFF" stroke="#2B2438" stroke-width="1.8"/><path d="m18 26 4.5 4.5 8-9" fill="none" stroke="#D0021B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    'my-schedule.html':'<rect x="7" y="10" width="34" height="31" rx="4" fill="#FFF" stroke="#2B2438" stroke-width="1.8"/><path d="M7 14a4 4 0 0 1 4-4h26a4 4 0 0 1 4 4v5H7z" fill="#F9DEE2" stroke="#2B2438" stroke-width="1.8"/><path d="M16 6v8M32 6v8" stroke="#2B2438" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="27" r="2" fill="#2B2438"/><circle cx="24" cy="27" r="2" fill="#2B2438"/><circle cx="32" cy="27" r="2" fill="#D0021B"/><circle cx="16" cy="34" r="2" fill="#2B2438"/><circle cx="24" cy="34" r="2" fill="#2B2438"/>',
    'attendance.html':'<circle cx="24" cy="26" r="15" fill="#F9DEE2" stroke="#2B2438" stroke-width="1.8"/><path d="M20 6h8M24 6v5" stroke="#2B2438" stroke-width="1.8" stroke-linecap="round"/><path d="M24 18v8l6 4" fill="none" stroke="#D0021B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
    'leave.html':'<rect x="8" y="16" width="32" height="23" rx="4" fill="#F9DEE2" stroke="#2B2438" stroke-width="1.8"/><path d="M18 16v-4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4" fill="none" stroke="#2B2438" stroke-width="1.8"/><path d="M8 25h32" stroke="#2B2438" stroke-width="1.8"/><rect x="21" y="22" width="6" height="6" rx="1.5" fill="#D0021B"/>',
    'expense.html':'<path d="M12 6h24v36l-4-3-4 3-4-3-4 3-4-3-4 3z" fill="#FFF" stroke="#2B2438" stroke-width="1.8" stroke-linejoin="round"/><path d="M18 14h12M18 20h8" stroke="#2B2438" stroke-width="1.8" stroke-linecap="round"/><circle cx="24" cy="29" r="5.5" fill="#F9DEE2" stroke="#D0021B" stroke-width="1.8"/><path d="M24 25.5v7" stroke="#D0021B" stroke-width="1.6" stroke-linecap="round"/>'
  };
  var grid=document.querySelector('.mh-grid');
  if(grid){
    grid.innerHTML=links.map(function(a){
      var href=a.getAttribute('href'), big=BIG[href];
      var svg=big ? '<svg viewBox="0 0 48 48" aria-hidden="true">'+big+'</svg>' : icon(a);
      return '<li><a class="mh-card" href="'+escA(href)+'">'+svg+'<span>'+label(a)+'</span></a></li>';
    }).join('');
  }

  // ---------- แผ่นเมนูบัญชี ----------
  var me=document.getElementById('meMenu'), sheet=document.getElementById('mhSheet'), prof=document.getElementById('mhProfile');
  if(me && sheet && prof){
    var panel=sheet.querySelector('.mh-sheetpanel');
    var copy=me.cloneNode(true);
    Array.prototype.forEach.call(copy.querySelectorAll('[id]'), function(n){ n.removeAttribute('id'); });
    panel.insertAdjacentHTML('beforeend', copy.innerHTML);
    var fill=function(){   // ชื่อและตำแหน่งถูกเติมทีหลังโดยสคริปต์ของหน้า
      var src=me.querySelectorAll('.mehead .av, .mehead b, .mehead .tx span'), dst=panel.querySelectorAll('.mehead .av, .mehead b, .mehead .tx span');
      for(var i=0;i<src.length && i<dst.length;i++) dst[i].textContent=src[i].textContent;
    };
    var openS=function(){ fill(); sheet.classList.add('on'); prof.setAttribute('aria-expanded','true'); };
    var closeS=function(){ sheet.classList.remove('on'); prof.setAttribute('aria-expanded','false'); };
    prof.addEventListener('click', function(ev){ ev.stopPropagation(); sheet.classList.contains('on')?closeS():openS(); });
    sheet.addEventListener('click', function(ev){ if(ev.target===sheet) closeS(); });
    document.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && sheet.classList.contains('on')){ closeS(); prof.focus(); } });
  }
  // TODO: กระดิ่งแจ้งเตือนยังไม่มีหน้าแจ้งเตือน
})();
</script>
