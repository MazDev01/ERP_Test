<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>งานที่ได้รับ — ERP MAZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --maz-red:#D0021B; --maz-red-deep:#8E0012; --maz-red-bright:#E8253C;
  --ink:#1F2430; --ink-soft:#68707E; --ink-faint:#9AA1AE;
  --line:#E8EBF0; --field:#FAFBFC; --white:#FFF;
  --ok:#14875A;   --ok-bg:#E7F5EE;
  --late:#C0121F; --late-bg:#FDECEE;
  --early:#B4630B;--early-bg:#FDF2E3;
  --leave:#1A3E8C;--leave-bg:#E7ECF7;
  --miss:#6B7280; --miss-bg:#F1F3F6;
  --off:#8A919E;  --off-bg:#F1F3F6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--ink);background:#F4F5F8;display:flex}

/* ---------- sidebar ---------- */
.side{width:228px;flex:none;color:var(--white);position:relative;background:linear-gradient(170deg,var(--maz-red-bright),var(--maz-red) 42%,var(--maz-red-deep));display:flex;flex-direction:column;padding:24px 0 18px}
.side::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,transparent 1px 44px),repeating-linear-gradient(90deg,rgba(255,255,255,.09) 0 1px,transparent 1px 44px);mask-image:linear-gradient(160deg,rgba(0,0,0,1) 8%,rgba(0,0,0,.3) 80%);-webkit-mask-image:linear-gradient(160deg,rgba(0,0,0,1) 8%,rgba(0,0,0,.3) 80%)}
.side > *{position:relative;z-index:1}
.logo{padding:0 24px 18px;font-size:21px;font-weight:700;letter-spacing:.05em;flex:none}
.nav{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:0 12px 12px;scrollbar-width:thin}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 13px;border-radius:10px;color:rgba(255,255,255,.82);text-decoration:none;font-size:13.5px;font-weight:500;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.12);color:var(--white)}
.nav a.on{background:var(--white);color:var(--maz-red);font-weight:600}
.nav svg{flex:none}
.grp{padding:12px 20px 5px;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:rgba(255,255,255,.55)}
.grp:first-child{padding-top:0}

/* ---------- app bar ---------- */
.main{position:relative;flex:1;min-width:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.appbar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 26px;background:var(--white);border-bottom:1px solid var(--line)}
.appbar .where{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600;min-width:0}
.appbar .where svg{color:var(--ink-faint);flex:none}
.appbar .side-tools{display:flex;align-items:center;gap:9px}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--white);color:var(--ink-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none}
.iconbtn:hover{border-color:var(--ink-faint);color:var(--ink)}
.iconbtn .dot{position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--maz-red);border:1.5px solid var(--white)}
.me{display:flex;align-items:center;justify-content:center;width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--white);cursor:pointer;font-family:inherit;flex:none}
.me:hover{border-color:var(--maz-red)}
.me .av{width:30px;height:30px;border-radius:50%;background:#FCEBEE;color:var(--maz-red);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.menu{position:absolute;top:50px;right:26px;z-index:60;width:236px;background:var(--white);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -18px rgba(60,20,30,.34);padding:8px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .18s,transform .18s,visibility .18s}
.menu.on{opacity:1;visibility:visible;transform:none}
.mehead{display:flex;align-items:center;gap:11px;padding:8px 10px 10px}
.mehead .av{width:40px;height:40px;border-radius:50%;background:#FCEBEE;color:var(--maz-red);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;flex:none}
.mehead .tx{min-width:0}
.mehead .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mehead .tx span{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.menu a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13px;color:var(--ink);text-decoration:none}
.menu a:hover{background:#FDECEE;color:var(--maz-red)}
.menu a.out{color:var(--maz-red)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 4px}

/* ---------- page ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 30px 0;flex-wrap:wrap}
.bar h1{font-size:23px;font-weight:700}
.bar p{margin-top:3px;font-size:13.5px;color:var(--ink-soft)}
.tools{display:flex;align-items:center;gap:10px}
.mo{display:flex;align-items:center;gap:2px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:3px}
.mo button{width:30px;height:30px;border:none;background:none;border-radius:8px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center}
.mo button:hover:not(:disabled){background:var(--field);color:var(--ink)}
.mo button:disabled{opacity:.35;cursor:default}
.mo span{padding:0 12px;font-size:13.5px;font-weight:600;min-width:120px;text-align:center}
.btn{height:36px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--white);color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--ink-faint);color:var(--ink)}
.btn.solid{border:none;background:var(--maz-red);color:var(--white);height:36px}
.btn.solid:hover{filter:brightness(1.06)}
.btn.solid.out{background:linear-gradient(100deg,#3B4657,#20293A)}
.btn.solid:disabled{cursor:default;background:#E7EAEF;color:var(--ink-faint);filter:none}



.panel{margin:16px 30px 22px;background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column}
.strip{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{background:none;border:none;cursor:pointer;font-family:inherit;padding:14px 13px 12px;font-size:13.5px;font-weight:500;color:var(--ink-soft);border-bottom:2.5px solid transparent}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--maz-red);border-bottom-color:var(--maz-red);font-weight:600}
.tabs button b{margin-left:6px;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:9px;background:var(--field);color:var(--ink-faint)}
.tabs button.on b{background:#FCEBEE;color:var(--maz-red)}
.legend{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:11.5px;color:var(--ink-faint);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;flex:none}

.scroll{flex:1;min-height:0;overflow:auto}
.pages{display:flex;gap:5px}
.pages button{min-width:31px;height:31px;padding:0 8px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--white);font-family:inherit;font-size:13px;color:var(--ink-soft)}
.pages button.on{background:var(--maz-red);border-color:var(--maz-red);color:var(--white);font-weight:600}
.pages button:disabled{opacity:.35;cursor:default}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{position:sticky;top:0;background:var(--white);z-index:2}
th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-faint);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
th.c,td.c{text-align:center}
th.r,td.r{text-align:right}
td{padding:12px 14px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr.today{background:#FEF7F8}
.day b{font-weight:600;font-variant-numeric:tabular-nums}
.day span{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:1px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-faint)}
.diff{font-size:11.5px;font-weight:600;margin-left:6px}
.diff.late{color:var(--late)}
.diff.early{color:var(--early)}
.sub2{display:block;font-size:11px;color:var(--ink-faint);margin-top:1px;font-weight:400}

.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.tag i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.t-ok{background:var(--ok-bg);color:var(--ok)}
.t-late{background:var(--late-bg);color:var(--late)}
.t-early{background:var(--early-bg);color:var(--early)}
.t-leave{background:var(--leave-bg);color:var(--leave)}
.t-miss{background:var(--miss-bg);color:var(--miss)}

.foot{flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 20px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap}
.foot .sum{font-variant-numeric:tabular-nums}
.foot .sum b{color:var(--ink);font-weight:600;margin-left:6px}

:focus-visible{outline:2.5px solid var(--maz-red);outline-offset:3px}
@media (max-width:1180px){
  .side{width:74px}
  .logo{padding:0 0 22px;text-align:center;font-size:17px}
  .nav a span,.grp{display:none}
  .nav a{justify-content:center;padding:12px 0}
  th.hide,td.hide{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* ---------- เพิ่มเฉพาะหน้าการลา ---------- */
.mo span{min-width:150px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 30px 0}
.card{border-radius:16px;padding:15px 17px;background:var(--white);border:1px solid var(--line)}
.card .ct{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .ct b{font-size:13.5px;font-weight:600}
.card .ct em{font-style:normal;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--field);color:var(--ink-faint)}
.card .big{margin-top:9px;font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.card .big u{text-decoration:none;font-size:13px;font-weight:600;color:var(--ink-soft);margin-left:5px}
.card .meta{margin-top:3px;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums}
.card .track{display:block;height:5px;border-radius:4px;background:rgba(31,36,48,.09);margin-top:11px;overflow:hidden}
.card .track i{display:block;height:100%;border-radius:4px;background:var(--maz-red)}

.t-pend{background:var(--early-bg);color:var(--early)}
.t-appr{background:var(--ok-bg);color:var(--ok)}
.t-rej{background:var(--late-bg);color:var(--late)}
.t-cxl{background:var(--miss-bg);color:var(--miss)}

.over{display:block;margin-top:4px;font-size:11px;font-weight:600;color:var(--late);line-height:1.3}
.why{display:block;font-size:11px;color:var(--ink-faint);margin-top:2px}
.clip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.span{display:block;white-space:nowrap}
.lnk{background:none;border:none;padding:0;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--maz-red);cursor:pointer}
.lnk:hover{text-decoration:underline}

/* ---------- กล่องยื่นใบลา ---------- */
.veil{position:fixed;inset:0;z-index:80;background:rgba(28,20,45,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s}
.veil.on{opacity:1;visibility:visible}
.box{width:100%;max-width:560px;max-height:100%;border-radius:18px;background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transform:translateY(8px);transition:transform .18s}
.veil.on .box{transform:none}
.bhead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.bhead h2{font-size:16.5px;font-weight:700}
.bbody{flex:1;min-height:0;overflow:auto;padding:18px 20px}
.bfoot{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line)}
.fld{margin-bottom:15px}
.fld:last-child{margin-bottom:0}
.fld > label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;height:38px;padding:0 11px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-family:inherit;font-size:13.5px;color:var(--ink)}
textarea{height:78px;padding:9px 11px;resize:vertical;line-height:1.5}
select{cursor:pointer}
.seg{display:flex;gap:3px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{flex:1;height:30px;border:none;background:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink-soft)}
.seg button.on{background:var(--white);color:var(--maz-red);font-weight:600;box-shadow:0 1px 3px rgba(28,20,45,.1)}
.calc{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border-radius:11px;background:var(--field);border:1px solid var(--line);font-size:13px}
.calc b{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.warn{margin-top:9px;padding:10px 13px;border-radius:11px;font-size:12.5px;line-height:1.55;background:var(--late-bg);color:var(--late);border:1px solid rgba(192,18,31,.2)}
.warn.hide{display:none}
.file{display:flex;align-items:center;gap:11px}
.file input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.file .pick{height:36px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink-soft);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;flex:none}
.file .pick:hover{border-color:var(--ink-faint);color:var(--ink)}
.file .fname{font-size:12.5px;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{margin-top:7px;font-size:11.5px;color:var(--ink-faint);line-height:1.5}

/* ---------- ช่องติกเลือกช่วงครึ่งวัน ---------- */
.picks{display:flex;flex-direction:column;gap:2px}
.pickone{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink)}
.pickone:hover{background:rgba(31,36,48,.05)}
.pickone.on{color:var(--maz-red);font-weight:600}
.pickone input{-webkit-appearance:radio;appearance:radio;width:17px;height:17px;margin:0;padding:0;flex:none;accent-color:var(--maz-red);background:none;border:none;box-shadow:none;cursor:pointer}
.pickone em{font-style:normal;font-size:12px;color:var(--ink-faint);margin-left:auto;font-variant-numeric:tabular-nums}
.pickone.on em{color:var(--maz-red)}

/* ---------- ตัวเลือกวันที่แบบไทย ---------- */
.dwrap{position:relative}
.dwrap input{cursor:pointer;padding-right:36px}
.dwrap .calbtn{position:absolute;bottom:0;right:0;width:36px;height:38px;border:none;background:none;cursor:pointer;color:var(--ink-faint);display:flex;align-items:center;justify-content:center}
.dwrap .calbtn:hover{color:var(--maz-red)}
.cal{position:absolute;z-index:90;top:100%;margin-top:5px;left:0;width:276px;padding:12px;border-radius:14px;background:var(--white);border:1px solid var(--line);box-shadow:0 22px 46px -20px rgba(40,25,60,.42);display:none}
.cal.on{display:block}
.cal.up, .tpop.up{top:auto;bottom:100%;margin-top:0;margin-bottom:5px}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.calhead b{font-size:13.5px;font-weight:600}
.calnav{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--white);cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex:none}
.calnav:hover{border-color:var(--ink-faint);color:var(--ink)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.calgrid span.dw{display:block;text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-faint);padding:5px 0}
.calgrid button{height:32px;border:none;background:none;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.calgrid button:hover{background:var(--field)}
.calgrid button.off{color:var(--ink-faint)}
.calgrid button.hol{color:var(--late)}
.calgrid button.on{background:var(--maz-red);color:var(--white);font-weight:700}
.calgrid button.blank{visibility:hidden;cursor:default}

/* ---------- ตัวเลือกเวลาแบบ stepper ---------- */
.twrap{position:relative}
.twrap input{cursor:pointer;padding-right:36px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.twrap .clockbtn{position:absolute;bottom:0;right:0;width:36px;height:38px;border:none;background:none;cursor:pointer;color:var(--ink-faint);display:flex;align-items:center;justify-content:center}
.twrap .clockbtn:hover{color:var(--maz-red)}
.tpop{position:absolute;z-index:90;top:100%;margin-top:5px;left:0;padding:13px;border-radius:14px;background:var(--white);border:1px solid var(--line);box-shadow:0 22px 46px -20px rgba(40,25,60,.42);display:none}
.tpop.on{display:flex;align-items:flex-start;gap:8px}
.tcol{display:flex;flex-direction:column;align-items:center;gap:5px;width:78px}
.tcol .h{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--ink-faint);margin-bottom:1px}
.tcol .step{width:34px;height:26px;border:none;background:none;border-radius:7px;cursor:pointer;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;flex:none}
.tcol .step:hover:not(:disabled){background:var(--field);color:var(--maz-red)}
.tcol .step:disabled{opacity:.28;cursor:default}
.tcol .val{display:block;width:100%;text-align:center;font-size:23px;font-weight:700;font-variant-numeric:tabular-nums;padding:7px 0;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.tsep{font-size:21px;font-weight:700;color:var(--ink-faint);padding-top:47px}


/* ---------- เฉพาะหน้าโอที ---------- */
.cards.two-up{grid-template-columns:repeat(2,1fr)}
.adj{display:block;margin-top:4px;font-size:11px;font-weight:600;color:var(--early);line-height:1.3}

@media (max-width:900px){
  .cards{grid-template-columns:1fr;margin:14px 18px 0}
  .two{grid-template-columns:1fr}
}

/* ---------- เฉพาะหน้าเบิกค่าใช้จ่าย ---------- */
.strip .stat{margin-left:auto;padding-right:4px}
.form{padding:22px 26px 26px}
.ftitle{text-align:center;font-size:16px;font-weight:700}
.fsub{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:3px}
.meta{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:10px 26px}
.mrow{display:flex;align-items:center;gap:10px;font-size:13px}
.mrow > span,.mrow > label{flex:none;width:130px;color:var(--ink-soft);font-weight:600}
.mrow > b{font-weight:600}
.mrow input{flex:1;min-width:0;height:34px;padding:0 11px;border-radius:9px;border:1px solid var(--line);background:var(--field);font-family:inherit;font-size:13px;color:var(--ink)}
.lead{margin-top:14px;font-size:13px;color:var(--ink-soft)}

table.grid{width:100%;border-collapse:collapse;margin-top:12px}
table.grid th{padding:9px 8px;background:var(--field);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-soft);text-align:left}

.scard .nu{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:10px}
.scard .ex{display:block;font-size:11.5px;color:var(--ink-faint);margin-top:6px;line-height:1.55}
.scard.alert .nu{color:var(--late)}

.pcard{padding:20px}
.pcard.tall{display:flex;flex-direction:column}
.pch{margin-bottom:16px}
.pch h2{margin:0;font-size:15px;font-weight:700}

/* ความคืบหน้าโปรเจค แต่ละข้อมูลคนละบรรทัด */
.plist3{display:flex;flex-direction:column;gap:14px;height:250px;overflow:auto}
.plist3 .prow3{flex:none}
.prow3{display:grid;grid-template-columns:minmax(0,1fr) 150px 120px;gap:16px;align-items:center;
  padding:14px 16px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit}
.prow3:hover{border-color:var(--maz-red)}
.pnm3{min-width:0}
.pnm3 b{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pnm3 em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-faint);margin-top:3px}
.pbar3{display:block;height:6px;border-radius:6px;background:var(--field);overflow:hidden;margin-top:9px}
.pbar3 i{display:block;height:100%;border-radius:6px;background:var(--maz-red)}
.pmid{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.pmid em{font-style:normal;color:var(--ink-faint);font-size:11px}
.ppct3{display:block;font-size:17px;font-weight:700;text-align:right}
.pst{display:block;font-size:11.5px;font-weight:600;text-align:right;margin-top:4px}
.pst.ok{color:var(--ok)}
.pst.late{color:var(--late)}
.pst.warn{color:var(--early)}

/* งานเข้าใหม่ */
.inbox2{align-items:flex-start}
.bignum{margin:0;font-size:40px;font-weight:800;letter-spacing:-.02em;line-height:1}
.bigsub{margin:6px 0 0;font-size:12.5px;color:var(--ink-soft)}
.inlist{list-style:none;margin:16px 0 0;padding:0;flex:none;width:100%;height:116px;overflow:auto}
.inlist li{padding:9px 0;border-top:1px solid var(--line);font-size:12.5px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inlist li:first-child{border-top:none}
.inlist .none5{color:var(--ink-faint);border-top:none}
.btn.wide{width:100%;margin-top:16px;justify-content:center}

.dash .scroll{overflow:auto}
.dash table{width:100%;border-collapse:collapse;min-width:700px}
.dash th{padding:12px 14px;font-size:12px;font-weight:600;color:var(--ink-soft);text-align:left;
  border-bottom:1px solid var(--line);white-space:nowrap}
.dash td{padding:13px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.dash tbody tr:last-child td{border-bottom:none}
.wst{font-size:12px;font-weight:600}
.wst.late{color:var(--late)}
.wst.soon{color:var(--early)}
.wst.none6{color:var(--ink-faint);font-weight:500}
.blank6{padding:34px 14px;text-align:center;color:var(--ink-faint);font-size:13px}
/* บรรทัดบอกจำนวนที่เหลือเมื่อเกินเพดานของการ์ด */
/* กรอบที่เลื่อนได้ มีเงาจางขอบล่างบอกว่ายังมีต่อ */
.fadebox{position:relative}
.fadebox::after{content:'';position:absolute;left:0;right:0;bottom:0;height:22px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.96))}
.more2{display:block;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--maz-red);text-decoration:none}
.more2:hover{text-decoration:underline}
.morerow{padding:12px 14px;color:var(--ink-faint);font-size:12.5px}

/* การ์ดในแถวเดียวกันสูงเท่ากัน และเนื้อหาข้างในยืดเต็มการ์ด
   ไม่ปล่อยให้เหลือพื้นที่ว่างด้านล่าง */
.grid12 > *{display:flex}
.grid12 > * > .pcard,.grid12 > * > .scard{flex:1}
.pcard{display:flex;flex-direction:column}
.pcard > .scroll{flex:none;height:330px}

/* ปฏิทินย่อ ขนาดกะทัดรัด พอดีกับข้อมูลเดือนเดียว */
.mcal{max-width:340px;border:1px solid var(--line);border-radius:12px;padding:12px}
.mchd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mcmon{font-size:13px;font-weight:700}
.mcnav{width:26px;height:26px;border:1px solid var(--line);border-radius:8px;background:var(--white);
  color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mcnav:hover{border-color:var(--maz-red);color:var(--maz-red)}
.mcgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mcgrid .dw{height:22px;display:flex;align-items:center;justify-content:center;
  font-size:10.5px;color:var(--ink-faint)}
.mcgrid button{height:30px;border:none;border-radius:8px;background:none;cursor:pointer;
  font-family:inherit;font-size:12px;color:var(--ink);position:relative}
.mcgrid button:hover{background:var(--field)}
.mcgrid button.off2{color:var(--ink-faint)}
.mcgrid button.today2{font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.mcgrid button.on2{background:var(--maz-red);color:#FFF;font-weight:700}
.mcgrid button.has2::after{content:'';position:absolute;left:50%;bottom:4px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--maz-red)}
.mcgrid button.on2.has2::after{background:#FFF}
.mcgrid span.blank7{height:30px}
.mcday{margin:14px 0 0;font-size:12.5px;font-weight:600;color:var(--ink-soft)}
.mclist{list-style:none;margin:8px 0 0;padding:0;flex:none;height:104px;overflow:auto}
.mclist li{padding:10px 0;border-top:1px solid var(--line)}
.mclist li:first-child{border-top:none}
.mclist b{display:block;font-size:12.5px;font-weight:600;line-height:1.5}
.mclist em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-faint);margin-top:3px}
.mclist .none7{color:var(--ink-faint);font-size:12.5px;padding:12px 0}

@media (max-width:1100px){ .col3{grid-column:span 6} .col4,.col8{grid-column:span 12} }
@media (max-width:640px){ .dash{padding:0 16px 24px} .col3{grid-column:span 12}
  .prow3{grid-template-columns:1fr;gap:10px} .ppct3,.pst{text-align:left} }

/* ตัวเลือกที่ถูกเลือกอยู่ในดรอปดาวน์ เป็นสีชมพูอ่อน */
select option:checked{
  background:#FDECEE linear-gradient(0deg,#FDECEE,#FDECEE);
  color:var(--maz-red);font-weight:600}
/* ================= glass theme ================= */
body{background:#F2F3F7}
body::before{
  content:'';position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38% 42% at 78% 6%,  rgba(255,64,92,.34),  transparent 68%),
    radial-gradient(34% 40% at 12% 18%, rgba(255,140,90,.26), transparent 66%),
    radial-gradient(42% 44% at 62% 88%, rgba(96,132,255,.28), transparent 68%),
    radial-gradient(36% 40% at 18% 82%, rgba(120,220,200,.24),transparent 66%),
    radial-gradient(30% 34% at 92% 60%, rgba(196,120,255,.22),transparent 66%),
    #F4F5F9;
  filter:blur(40px);
}
/* ชั้นฝ้าบางๆ ให้สีไม่จัดเกินและตัวหนังสืออ่านง่าย */
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:rgba(255,255,255,.34);
}

/* ---- พื้นผิวกระจก ---- */
.panel, .card, .kpi, .pcard, .revcard, .box, .edu-wrap{
  background:rgba(255,255,255,.46);
  backdrop-filter:blur(30px) saturate(190%);
  -webkit-backdrop-filter:blur(30px) saturate(190%);
  border:1px solid rgba(255,255,255,.58);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    inset 0 -1px 0 rgba(255,255,255,.28),
    0 1px 2px rgba(28,20,45,.05),
    0 18px 40px -20px rgba(40,25,60,.30);
}
.appbar, .topbar{
  background:rgba(255,255,255,.52);
  backdrop-filter:blur(26px) saturate(190%);
  -webkit-backdrop-filter:blur(26px) saturate(190%);
  border-bottom:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8), 0 8px 26px -20px rgba(40,25,60,.5);
}
.menu{
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(34px) saturate(200%);
  -webkit-backdrop-filter:blur(34px) saturate(200%);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 26px 54px -24px rgba(40,25,60,.45);
}
.search, .seg, .seg2, .mo, .iconbtn, .me, .btn.ghost, .chip, .drop, .master, .opt, .pages button, .tabs, .sw{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(255,255,255,.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
.iconbtn:hover, .me:hover, .btn.ghost:hover, .chip:hover{background:rgba(255,255,255,.72)}
.chip.on, .opt.on, .seg button.on, .seg2 button.on, .pages button.on{box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}

/* ปุ่มหลักเป็นแก้วสีแดง ไม่ใช่สีทึบ */
.btn.solid, .add, .solid{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34), 0 12px 26px -12px rgba(208,2,27,.6);
}

/* ตารางโปร่ง เห็นชั้นสีด้านหลัง */
thead th{background:rgba(255,255,255,.62)!important;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
tbody tr:hover{background:rgba(255,255,255,.42)}
tr.sub td{background:rgba(255,255,255,.34)}
table.rounds, table.revs, table.inner{background:rgba(255,255,255,.5)}

/* ช่องกรอกทึบกว่าเล็กน้อยเพื่อให้อ่านง่าย */
input, select, textarea{
  background:rgba(255,255,255,.58);
  border-color:rgba(255,255,255,.7);
  box-shadow:inset 0 1px 2px rgba(40,25,60,.05);
}
input:hover, select:hover, textarea:hover{background:rgba(255,255,255,.72)}
input:focus, select:focus, textarea:focus{background:rgba(255,255,255,.92)}
input:disabled, input[readonly]{background:rgba(240,241,245,.62)}

/* กระดาษเอกสารต้องทึบ เพราะต้องพิมพ์จริง */
.paper{
  background:#FFF;backdrop-filter:none;-webkit-backdrop-filter:none;
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 2px 8px rgba(28,20,45,.06), 0 30px 66px -30px rgba(40,25,60,.45);
}

@supports not (backdrop-filter: blur(2px)){
  body::before{filter:none;opacity:.5}
  .panel,.card,.kpi,.pcard,.revcard,.box,.edu-wrap,.menu,.appbar,.topbar{background:rgba(255,255,255,.94)}
}
@media print{ body::before,body::after{display:none} }

/* ===== glass theme — ส่วนเพิ่ม (ใช้ร่วมทุกหน้า) ===== */
/* บล็อกด้านบนคลุมแค่ .panel .card .menu .appbar ฯลฯ ส่วนนี้เก็บของที่ตกสำรวจ
   ห้ามเขียน CSS ของหน้าไว้ใต้บล็อกนี้ ไม่งั้นจะไปทับธีมกระจก */

/* กล่องที่ลอยทับเนื้อหา ต้องทึบกว่าการ์ดพื้นหลัง ไม่งั้นตารางด้านหลังทะลุจนอ่านไม่ออก */
.drawer, .list, .tip, /* เมนูบัญชีลอยทับเนื้อหา ถ้าโปร่งจะเห็นข้อความข้างหลังทะลุจนอ่านยาก ต้องทึบ */
.menu{
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-color:rgba(31,36,48,.1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 26px 54px -24px rgba(40,25,60,.45);
}
.cal, .tpop{
  background:rgba(255,255,255,.93);
  backdrop-filter:blur(34px) saturate(200%);
  -webkit-backdrop-filter:blur(34px) saturate(200%);
  border-color:rgba(255,255,255,.8);
}
.box{
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(36px) saturate(200%);
  -webkit-backdrop-filter:blur(36px) saturate(200%);
  border-color:rgba(255,255,255,.75);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95), 0 34px 70px -28px rgba(40,25,60,.5);
}

/* ปุ่มเล็กในตารางและแถบเครื่องมือ ให้เป็นแก้วระดับเดียวกับ .iconbtn */
.act, .del, .mini, .more, .calbar button, .file .rm, .b-line, .pick, .calnav, .tcol .val{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(255,255,255,.62);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}
/* ไม่ใส่ .del:hover เพราะหน้าใบเสนอราคากำหนดพื้นแดงอ่อนตอน hover ไว้แล้ว */
.act:hover, .mini:hover, .more:hover, .calbar button:hover, .file .rm:hover, .b-line:hover, .pick:hover, .calnav:hover{
  background:rgba(255,255,255,.76);
}

/* ปฏิทินไทยและตัวเลือกเวลาแบบ stepper (หน้าการลา) */
.calgrid button:hover{background:rgba(31,36,48,.06)}
.calgrid button.on:hover{background:var(--maz-red)}
.tcol .step:hover:not(:disabled){background:rgba(31,36,48,.06)}
.card .track{background:rgba(31,36,48,.13)}
.calc{
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(31,36,48,.09);
}
.bhead, .bfoot{border-color:rgba(31,36,48,.09)}

/* กล่องไฟล์แนบ */
.file{
  background:rgba(255,255,255,.42);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border-color:rgba(255,255,255,.6);
}

/* หน้าเข้าสู่ระบบ */
.shell, .formside, .scoop{
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(30px) saturate(190%);
  -webkit-backdrop-filter:blur(30px) saturate(190%);
}

/* ตัวเครื่องในหน้าตัวอย่างสถานะบัญชี เป็นภาพจำลองมือถือ ต้องทึบ ไม่ใส่กระจก */

@supports not (backdrop-filter: blur(2px)){
  .drawer,.list,.tip,.cal,.tpop,.box{background:rgba(255,255,255,.98)}
  .shell,.formside,.scoop{background:rgba(255,255,255,.96)}
}

/* ===== เลื่อนทั้งคอลัมน์เนื้อหาเป็นก้อนเดียว ไม่เลื่อนในตาราง (ใช้ร่วมทุกหน้า) ===== */
/* เดิมตารางมีสกรอลล์ของตัวเองซ้อนอยู่ข้างใน เอาออกให้เลื่อนทีเดียวทั้งคอลัมน์
   ตัวที่เลื่อนคือ .main ไม่ใช่ทั้งหน้า เมนูซ้ายเลยอยู่กับที่เสมอ ไม่ต้องพึ่ง sticky
   (ถ้าให้ทั้งหน้ายาวแล้วใช้ sticky เมนูจะหายตอนเลื่อนในกรอบพรีวิวที่สูงเท่าเนื้อหา) */
/* ต้องระบุ main.main เพราะมีปุ่มที่ใช้คลาส main ด้วย ถ้าเขียน .main เฉยๆ ปุ่มจะสูงเท่าจอ */
main.main{height:100vh;overflow:auto}
.panel{flex:none}
.scroll, .scrollarea, .stage{flex:none;min-height:0;overflow:visible}
/* ยกเว้นดรอปดาวน์ค้นหา ต้องเลื่อนในกล่องตัวเองเหมือนเดิม */
.list .scrollarea{max-height:264px;overflow:auto}
/* แถบหัวลอยอยู่บนสุดของคอลัมน์เนื้อหา และต้องทึบพอให้อ่านออกตอนเนื้อหาเลื่อนลอดใต้ */
.appbar, .topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86)}
/* แผงเลื่อนข้างและกล่องซ้อนยังเลื่อนในตัวเองตามเดิม */
.drawer .body, .bbody{overflow:auto}
@media print{ .appbar, .topbar{position:static} .main{height:auto;overflow:visible} }

.twrap input.bad, .dwrap input.bad{
  border-color:var(--late);
  background:var(--late-bg);
  color:var(--late);
  font-weight:600;
}
.twrap input.bad ~ .clockbtn, .dwrap input.bad ~ .calbtn{color:var(--late)}

/* ===== มือถือ: ตารางรายการเปลี่ยนเป็นการ์ดต่อแถว (ใช้ร่วมทุกหน้า) =====
   จอ 640px ลงมา ตารางหลายคอลัมน์อ่านยากมากถ้าเลื่อนแนวนอน
   จึงพับแต่ละแถวเป็นการ์ด โดยเอาชื่อคอลัมน์จาก th มาไว้หน้าเซลล์
   ใช้เฉพาะตารางรายการ (.scroll > table) ไม่แตะตารางในเอกสาร A4 หรือตารางกรอกในฟอร์ม */
@media (max-width:640px){
  /* ตารางที่แปลงเป็นการ์ดจะแคบพอดีอยู่แล้ว ส่วนตารางกรอกในฟอร์มยังกว้าง ต้องเลื่อนข้างได้
     ถ้าตั้ง visible เนื้อหาจะถูกตัดหายโดยไม่มีทางเลื่อนไปดู */
  .scroll{overflow-x:auto}
  .scroll > table.grid{min-width:760px}
  .scroll > table:not(.grid){min-width:0!important;display:block;border-collapse:separate;border-spacing:0}
  .scroll > table:not(.grid) > thead{display:none}
  .scroll > table:not(.grid) > tbody{display:block}

  .scroll > table:not(.grid) > tbody > tr{
    display:block;margin:10px 14px;padding:6px 2px;
    border:1px solid var(--line);border-radius:13px;background:var(--white);
  }
  .scroll > table:not(.grid) > tbody > tr > td{
    display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
    width:auto;border:none;padding:7px 13px;text-align:right;
  }
  .scroll > table:not(.grid) > tbody > tr > td::before{
    content:attr(data-label);flex:none;max-width:44%;
    color:var(--ink-faint);font-size:12px;font-weight:600;text-align:left;line-height:1.5;
  }
  .scroll > table:not(.grid) > tbody > tr > td:not([data-label])::before{content:none}
  .scroll > table:not(.grid) > tbody > tr > td > *{text-align:right}
  .scroll > table:not(.grid) > tbody > tr > td .clip{white-space:normal}

  /* แถวว่างและแถวที่กางรายละเอียดคร่อมทั้งแถว ให้แสดงเต็มความกว้างตามเดิม */
  .scroll > table:not(.grid) > tbody > tr.sub{margin:0;padding:0;border:none;border-radius:0;background:none}
  .scroll > table:not(.grid) > tbody > tr.sub > td{display:block;text-align:left;padding:0}
  .scroll > table:not(.grid) > tbody > tr.sub > td::before{content:none}
  .scroll > table:not(.grid) > tbody > tr > td.blank,
  .scroll > table:not(.grid) > tbody > tr > td.empty{display:block;text-align:center}
  .scroll > table:not(.grid) > tbody > tr > td.blank::before,
  .scroll > table:not(.grid) > tbody > tr > td.empty::before{content:none}

  /* ตารางย่อยข้างในการ์ดยังเป็นตารางปกติ แต่ให้เลื่อนข้างได้ */
  .subwrap{overflow-x:auto}
  table.inner{min-width:560px}


  /* แถบหัวหน้า: ชื่อหน้ากับปุ่มเครื่องมือไม่พอในบรรทัดเดียว ต้องตกบรรทัดแทนการถูกตัดหาย */
  .bar{flex-wrap:wrap;gap:12px}
  .bar .tools{width:100%;flex-wrap:wrap;justify-content:flex-start;gap:9px}
  .bar .tools .mo{flex:1 1 auto;min-width:0;justify-content:space-between}
  .bar .tools .btn, .bar .tools .seg{flex:1 1 auto;justify-content:center}
  .bar h1{font-size:20px}

  /* กริดที่ตั้งความกว้างคอลัมน์เป็นพิกเซลตายตัวไว้ ต้องบีบให้พอดีจอ ไม่งั้นลูกล้นออกไป */
  .shell{grid-template-columns:minmax(0,1fr)!important;max-width:100%!important}
  .pcard, .scoop{max-width:100%!important;width:auto!important;min-width:0}
  .profile{grid-template-columns:1fr!important}
  .facts{grid-template-columns:1fr!important}
  .two, .two-up, .wide-left, .moneygrid{grid-template-columns:1fr!important}

  /* ตารางอื่นที่ไม่ได้อยู่ในกรอบเลื่อน ต้องมีกรอบเลื่อนของตัวเอง */
  .pcard table, .card table{display:block;overflow-x:auto;max-width:100%}

  /* ช่องค้นหาและแถวป้าย-ค่า ตั้งความกว้างตายตัวไว้ ต้องยืดหดตามจอ */
  .search{width:100%!important;min-width:0}
  .search input{width:100%;min-width:0}
  .mrow{flex-wrap:wrap;gap:4px 10px}
  .mrow > span, .mrow > label{width:auto;min-width:120px}
  .card, .panel{min-width:0}

  /* ปุ่มยาวๆ อย่างส่งออก Excel และแถวปุ่มด้านขวาให้ตกบรรทัด ไม่ดันออกนอกจอ */
  .right, .acts, .btnrow{flex-wrap:wrap}
  .btn{white-space:nowrap}
  .bars .bar{max-width:100%}

  /* แถบเลขหน้าและปุ่มสาธิตให้ตกบรรทัดแทนที่จะดันออกนอกจอ */
  .pages{flex-wrap:wrap;justify-content:center}
  .foot{flex-wrap:wrap;gap:10px}
  .demo{flex-wrap:wrap;justify-content:center}

  /* ตารางกรอกในกล่องซ้อน ให้เลื่อนข้างในกล่องแทนที่จะดันกล่องล้นจอ */
  .bbody{overflow-x:auto}
  .bbody table.grid{min-width:420px}

  /* แท็บบนมือถือให้เลื่อนแนวนอนแทนที่จะตกบรรทัด */
  .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none}
  .strip{flex-wrap:wrap;gap:8px}
  .legend{display:none}
}

/* ===== แท็บเล็ต: กล่องที่ตั้งความกว้างเป็นพิกเซลตายตัวต้องยืดหดตามจอด้วย ===== */
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)!important;max-width:100%!important}
  .pcard, .scoop{max-width:100%!important;width:auto!important;min-width:0}
  .pcard table, .card table{display:block;overflow-x:auto;max-width:100%}
}
/* ===== จอแคบมาก: การ์ดสรุปเรียงลงคอลัมน์เดียว ===== */
@media (max-width:420px){
  .cards{grid-template-columns:minmax(0,1fr)!important}
  .cards > *{min-width:0}
  /* กริดหลายคอลัมน์ในแดชบอร์ดเหลือคอลัมน์เดียว ไม่งั้นคอลัมน์กว้างเกินจอ */
  .grid, .grid2, .grid3{grid-template-columns:minmax(0,1fr)!important}
  .grid > *, .grid2 > *, .grid3 > *{min-width:0}
}

/* ===== มือถือ: เปลี่ยนเมนูข้างเป็นแถบล่าง ===== */
.botnav{display:none}
.bnsheet{display:none}
@media (max-width:640px){
  /* ซ่อนแถบข้าง ใช้แถบล่างแทน เพราะนิ้วโป้งเอื้อมถึงง่ายกว่า */
  .side{display:none!important}
  main.main{margin-left:0!important;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
  body{padding-bottom:0}

  .botnav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:90;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(26px) saturate(180%);
    -webkit-backdrop-filter:blur(26px) saturate(180%);
    border-top:1px solid rgba(31,36,48,.09);
    box-shadow:0 -6px 22px -14px rgba(40,25,60,.35);
  }
  .bn-i{
    flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    padding:6px 2px;border:none;background:none;cursor:pointer;text-decoration:none;
    font-family:inherit;color:var(--ink-faint);border-radius:12px;
  }
  .bn-i svg{width:21px;height:21px;flex:none}
  .bn-i span{font-size:10.5px;font-weight:600;line-height:1.25;text-align:center;
             max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bn-i.on{color:var(--maz-red)}
  .bn-i.on svg{stroke-width:2.1}
  .bn-i:active{background:rgba(208,2,27,.07)}

  /* แผ่นเมนูทั้งหมด เลื่อนขึ้นจากด้านล่าง */
  .bnsheet{
    display:block;position:fixed;inset:0;z-index:95;
    background:rgba(28,20,45,.42);
    opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s;
  }
  .bnsheet.on{opacity:1;visibility:visible}
  .bnpanel{
    position:absolute;left:0;right:0;bottom:0;
    background:var(--white);border-radius:20px 20px 0 0;
    padding:10px 16px calc(18px + env(safe-area-inset-bottom));
    transform:translateY(14px);transition:transform .22s;
    max-height:78vh;overflow:auto;
  }
  .bnsheet.on .bnpanel{transform:translateY(0)}
  .bngrab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
  .bntitle{font-size:13px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;padding-left:4px}
  .bnlist{display:flex;flex-direction:column}
  .bnrow{
    display:flex;align-items:center;gap:13px;padding:13px 12px;border-radius:12px;
    text-decoration:none;color:var(--ink);font-size:14.5px;font-weight:500;
  }
  .bnrow svg{width:19px;height:19px;flex:none;color:var(--ink-faint)}
  .bnrow.on{background:#FEF5F6;color:var(--maz-red);font-weight:700}
  .bnrow.on svg{color:var(--maz-red)}
  .bnrow:active{background:var(--field)}
}

/* ===== งานที่ได้รับ: หน้าตาตามภาพต้นแบบ =====
   วางไว้ใต้ธีมกระจกโดยตั้งใจ เพราะต้นแบบเป็นพื้นขาวเรียบ ไม่มีกระจก ส่วนแถบข้างใช้แบบแดงของระบบเดิม
   สเกลจากต้นแบบ: 1 px ในภาพ ≈ 2.29 px ที่จอกว้าง 1440 */
body.tk{
  --tk-ink:#2B2438; --tk-soft:#6E6C7A; --tk-faint:#A3A1AE; --tk-date:#B9B5C4;
  --tk-tint:#F9DEE2; --tk-row:#F7F7F8; --tk-link:#4E5DA6;
  --tk-c1:#F0CE53; --tk-c2:#D0021B; --tk-c3:#F25F96; --tk-c4:#F2BCC3;
  /* สีขั้นงาน เรียงตามลำดับ: ได้รับ เทา · รอตรวจ เหลือง · ต้องแก้ แดง · เสร็จ เขียว */
  --tk-s1:#8A919E; --tk-s2:#E8AE1B; --tk-s3:#D0021B; --tk-s4:#14875A;
  background:#FFF;
}
body.tk::before, body.tk::after{display:none}

/* หัวหน้า */
body.tk .tk-head{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
  padding:38px 48px 20px 45px;background:#FFF;border:none;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none}
body.tk .tk-headtx{min-width:0}
body.tk .tk-title{font-size:22px;font-weight:600;line-height:30px;color:var(--tk-ink)}
body.tk .tk-date{display:flex;gap:8px;margin-top:4px;font-size:14px;line-height:20px}
body.tk .tk-date b{font-weight:600;color:var(--tk-c2)}
body.tk .tk-date span{font-weight:500;color:var(--tk-date)}
body.tk .tk-tools{display:flex;align-items:center;gap:9px;position:relative}
body.tk .tk-bell{position:relative;width:24px;height:24px;padding:0;border:none;background:none;cursor:pointer;
  color:#6E6C7A;display:flex;align-items:center;justify-content:center}
body.tk .tk-bell:hover{color:var(--tk-ink)}
body.tk .tk-bell .dot{position:absolute;top:1px;right:2px;width:7px;height:7px;border-radius:50%;
  background:var(--tk-c2);border:1.5px solid #FFF}
body.tk .menu{top:48px;right:0}

/* เนื้อหา */
body.tk .tk-page{padding:69px 48px 48px 45px}

.tk-hero{position:relative;height:209px;border-radius:20px;background:var(--tk-tint);padding:58px 0 0 60px}
.tk-herotx{position:relative;z-index:1;max-width:58%}
.tk-hi{font-family:'Noto Serif Thai',Georgia,'Times New Roman',serif;font-size:44px;font-weight:700;
  line-height:54px;color:#21192E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-herosub{margin-top:12px;font-size:17px;line-height:26px;color:#2B2440}
.tk-heroart{position:absolute;right:39px;top:-53px;width:360px;height:275px;pointer-events:none;overflow:visible}

.tk-ovhead{display:flex;align-items:center;justify-content:space-between;gap:16px;height:20px;margin-top:47px}
.tk-ovlabel{font-size:14px;line-height:20px;font-weight:500;color:var(--tk-faint)}
body.tk input.tk-search{width:260px;height:34px;padding:0 13px;border-radius:6px;border:1px solid #ECECF0;
  background:#FFF;box-shadow:none;font-size:13px;color:var(--tk-ink)}
body.tk input.tk-search:focus{outline:none;border-color:var(--tk-c2);background:#FFF}

.tk-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:23px;margin-top:24px}
.tk-stat{display:flex;align-items:center;height:85px;padding:0 16px 0 19px;border:none;border-radius:8px;
  cursor:pointer;font-family:inherit;text-align:left;color:#FFF;min-width:0}
.tk-c1{background:var(--tk-s1)} .tk-c2{background:var(--tk-s2)}
.tk-c3{background:var(--tk-s3)} .tk-c4{background:var(--tk-s4)}
.tk-stat.on{box-shadow:0 0 0 3px #FFF,0 0 0 5px var(--tk-ring)}
.tk-c1{--tk-ring:var(--tk-s1)} .tk-c2{--tk-ring:var(--tk-s2)} .tk-c3{--tk-ring:var(--tk-s3)} .tk-c4{--tk-ring:var(--tk-s4)}
.tk-sico{display:flex;align-items:center;justify-content:center;width:47px;height:47px;border-radius:8px;
  background:rgba(255,255,255,.2);flex:none}
.tk-sico svg{width:24px;height:24px}
.tk-stx{display:block;margin-left:46px;min-width:0}
.tk-stx b{display:block;font-size:26px;line-height:30px;font-weight:700}
.tk-stx span{display:block;margin-top:0;font-size:13px;line-height:18px;font-weight:500;opacity:.88;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tk-rows{display:flex;flex-direction:column;gap:21px;margin-top:46px}
.tk-row{position:relative;display:flex;align-items:center;width:100%;height:163px;padding:0 27px 0 28px;
  border-radius:6px;background:var(--tk-row);color:var(--tk-ink)}
/* ปุ่มโปร่งใสคลุมทั้งแถวไว้เปิดรายละเอียด ปุ่มส่งงานวางทับด้านบน */
.tk-rhit{position:absolute;inset:0;z-index:1;width:100%;height:100%;padding:0;border:none;border-radius:6px;
  background:none;cursor:pointer}
.tk-rsend{position:absolute;right:27px;bottom:24px;z-index:2;height:36px;padding:0 20px;border:none;border-radius:999px;
  background:var(--tk-c2);color:#FFF;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.tk-rsend:hover{background:#B00318}
.tk-row:hover{background:#F1F1F3}
.tk-thumb{display:flex;align-items:center;justify-content:center;width:107px;height:107px;border-radius:4px;flex:none;color:#FFF}
.tk-thumb svg{width:40px;height:40px}
.tk-rtx{display:block;margin-left:23px;min-width:0;flex:1;padding-right:150px}
.tk-rname{display:block;font-size:16px;line-height:22px;font-weight:600;color:var(--tk-link);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:560px}
.tk-rdesc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  margin-top:3px;max-width:450px;font-size:13.5px;line-height:24px;color:var(--tk-soft);height:48px}
.tk-rwhen{display:block;margin-top:9px;font-size:14px;line-height:20px;font-weight:600;color:var(--tk-ink)}
.tk-rwhen.tk-late{color:var(--late)}
.tk-rside{position:absolute;top:36px;right:27px;max-width:34%;font-size:13px;line-height:20px;font-weight:600;
  color:var(--tk-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-empty{display:flex;align-items:center;justify-content:center;height:163px;border-radius:6px;
  background:var(--tk-row);font-size:14px;color:var(--tk-faint)}

/* กล่องรายละเอียดงาน */
/* กล่องต้องอยู่เหนือแถบเมนูล่างบนมือถือ (z 90) ไม่งั้นปุ่มส่งงานถูกบัง */
#tkVeil{z-index:96}
#pvVeil{z-index:97}
body.tk .tk-box{max-width:560px;max-height:88vh;border-radius:20px;background:#FFF;border:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:0 30px 70px -30px rgba(40,25,60,.45)}
body.tk .tk-box .bhead h2{font-size:18px;font-weight:600;color:var(--tk-ink)}
/* ปุ่มปิดกล่อง: ปกติกรอบจางเท่ากรอบอื่นในกล่อง เป็นแดง MAZ เมื่อเอาเมาส์ชี้ หรือเมื่อเลือกด้วยคีย์บอร์ดเท่านั้น */
body.tk .veil .bhead .iconbtn{border:1px solid var(--line);background:#FFF;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--tk-soft)}
body.tk .veil .bhead .iconbtn:hover{border-color:var(--tk-c2);color:var(--tk-c2);background:#FFF}
body.tk .veil .bhead .iconbtn:focus{outline:none}
body.tk .veil .bhead .iconbtn:focus-visible{outline:none;border-color:var(--tk-c2);color:var(--tk-c2);
  box-shadow:0 0 0 3px rgba(208,2,27,.14)}
/* กล่องรับ focus ตอนเปิดด้วยเมาส์ ไม่ต้องมีกรอบ */
body.tk .tk-box:focus{outline:none}
body.tk .tk-detail{padding:0;border:none;background:none;border-radius:0}
body.tk .tk-detail .dproj{margin:0}
body.tk .tk-detail .dsec:first-of-type{margin-top:18px}
body.tk .tk-detail > .dsec:first-child{margin-top:0}
body.tk .tk-detail > .tk-info:first-child{margin-top:0}
body.tk .tk-detail > .dback:first-child{margin-top:0}
body.tk .tk-detail .hfile .tk-hf{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.tk .tk-detail > .dsec:first-child .hist > li:first-child .hhd2{padding-top:0}
body.tk .tk-detail .tk-taskname{margin:0;font-size:15px;line-height:1.6;font-weight:600;color:var(--tk-ink)}
body.tk .tk-detail .tk-brief{margin-top:4px}
body.tk .tk-detail .tk-kvafter{margin-top:20px}
body.tk .tk-detail .tk-kvlabel{margin:20px 0 6px;font-size:11.5px;font-weight:600;color:var(--ink-soft)}


/* ส่วนแนบไฟล์ส่งงาน ตามภาพต้นแบบอัปโหลดไฟล์ (ขาว เทา ดำ ยกเว้นปุ่มหลักเป็นแดง MAZ) */
.tk-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;height:212px;
  border-radius:10px;background:#F0F0F0;cursor:pointer;text-align:center}
.tk-drop.over{background:#F9DEE2;box-shadow:inset 0 0 0 1.5px var(--tk-c2)}
.tk-dropic{display:flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:12px;
  background:#FFF;color:#111}
.tk-dropt{margin:14px 0 0;font-size:15px;line-height:20px;font-weight:500;color:#111}
.tk-files{list-style:none;margin:50px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.tk-files:empty{display:none}
.tk-file{position:relative;display:flex;align-items:center;min-height:72px;padding:8px 17px 8px 8px;
  border:1.5px solid #D4D4D4;border-radius:10px;background:#FFF}
.tk-file.tk-busy{min-height:102px;align-items:flex-start;padding-bottom:36px}
.tk-ftype{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:8px;flex:none;
  background:#F3F3F3;border:1px solid #E8E8E8;font-size:13px;font-weight:500;color:#595959;letter-spacing:.02em}
.tk-fmeta{display:block;min-width:0;flex:1;margin-left:9px}
.tk-fmeta b{display:block;font-size:17px;line-height:24px;font-weight:500;color:#111;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk-fmeta em{display:block;margin-top:1px;font-style:normal;font-size:15px;line-height:20px;color:#959595}
.tk-fbtn{display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin-left:12px;flex:none;
  border:none;border-radius:8px;background:none;color:#111;cursor:pointer}
.tk-busy .tk-fbtn{margin-top:9px}
.tk-fbtn:hover{background:#F3F3F3}
.tk-prog{position:absolute;left:8px;right:23px;bottom:14px;height:5px;border-radius:3px;background:#F1F1F1;overflow:hidden}
.tk-prog i{display:block;height:100%;border-radius:3px;background:#000;transition:width .1s linear}
.tk-note{margin-top:24px}
body.tk .tk-note textarea{border:1.5px solid #D4D4D4;border-radius:10px;background:#FFF;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;font-size:15px}
body.tk .tk-note textarea:focus, body.tk .tk-note textarea:focus-visible{outline:none;border-color:var(--tk-c2);background:#FFF}
.tk-sendrow{display:grid;grid-template-columns:192px 192px;gap:27px;justify-content:center;margin-top:44px}
.tk-pill{height:44px;border-radius:999px;font-family:inherit;font-size:18px;font-weight:500;cursor:pointer;padding:0 16px}
.tk-ghost{background:#FFF;color:#111;border:1.5px solid #D4D4D4}
.tk-ghost:hover{border-color:#111}
.tk-solid{background:var(--tk-c2);color:#FFF;border:none}
.tk-solid:hover{background:#B00318}

body.tk .tk-detail .subcard.tk-plain{padding:0;border:none;border-radius:0;background:none;box-shadow:none}
body.tk .tk-detail .tk-sentfiles{margin-top:18px}
body.tk .tk-detail .tk-sentnote{color:var(--ink-soft)}

/* ข้อความสั้นหลังส่งงาน */
.tk-toast{position:fixed;left:50%;bottom:32px;z-index:99;display:flex;align-items:center;gap:10px;

<!-- ===== ตารางเป็นการ์ดบนมือถือ (ใส่ร่วมทุกหน้าโดย apply_glass.py) ===== -->
<script>
(function(){
  // บนจอแคบตารางถูกจัดใหม่เป็นการ์ด แต่ละเซลล์ต้องมีป้ายชื่อคอลัมน์ของตัวเอง
  // เพราะหัวตารางถูกซ่อน จึงคัดชื่อจาก th มาใส่เป็น data-label ให้ทุก td
  function label(t){
    var ths = t.querySelectorAll(':scope > thead > tr > th');
    if(!ths.length) return;
    var rows = t.querySelectorAll(':scope > tbody > tr');
    Array.prototype.forEach.call(rows, function(tr){
      if(tr.classList.contains('sub')) return;          // แถวที่กางรายละเอียดคร่อมทั้งแถว ไม่ต้องมีป้าย
      Array.prototype.forEach.call(tr.children, function(td, i){
        if(!ths[i]) return;
        var txt = ths[i].textContent.trim();
        if(txt) td.setAttribute('data-label', txt);
        else td.removeAttribute('data-label');
      });
    });
  }
  function run(){
    Array.prototype.forEach.call(document.querySelectorAll('.scroll > table'), label);
  }
  run();
  // ตารางถูกวาดใหม่ด้วย JS ตลอด ต้องติดป้ายใหม่ทุกครั้งที่แถวเปลี่ยน
  if(window.MutationObserver){
    var mo = new MutationObserver(run);
    Array.prototype.forEach.call(document.querySelectorAll('.scroll > table > tbody'), function(tb){
      mo.observe(tb, {childList:true});
    });
  }
})();
</script>

<!-- ===== แถบเมนูล่างบนมือถือ (ใส่ร่วมทุกหน้าโดย apply_glass.py) ===== -->
<script>
(function(){
  var side = document.querySelector('.side .nav');
  if(!side) return;

  var links = Array.prototype.slice.call(side.querySelectorAll('a'));
  if(!links.length) return;

  // เอา 4 เมนูแรกขึ้นแถบล่าง ที่เหลือไปอยู่ในปุ่ม "อื่นๆ"
  var MAIN = 4;
  var main = links.slice(0, MAIN), rest = links.slice(MAIN);

  function iconOf(a){
    var svg = a.querySelector('svg');
    return svg ? svg.outerHTML : '';
  }
  function labelOf(a){
    var s = a.querySelector('span');
    return s ? s.textContent.trim() : a.textContent.trim();
  }

  var bn = document.createElement('nav');
  bn.className = 'botnav';
  bn.setAttribute('aria-label','เมนูหลัก');

  bn.innerHTML = main.map(function(a){
    return '<a href="'+a.getAttribute('href')+'" class="bn-i'+(a.classList.contains('on')?' on':'')+'">'+
      iconOf(a)+'<span>'+labelOf(a)+'</span></a>';
  }).join('') +
  (rest.length
    ? '<button type="button" class="bn-i" id="bnMore" aria-haspopup="true" aria-expanded="false">'+
      '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">'+
      '<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/>'+
      '<circle cx="19" cy="12" r="1.4" fill="currentColor"/></svg><span>อื่นๆ</span></button>'
    : '');
  document.body.appendChild(bn);

  if(rest.length){
    var sheet = document.createElement('div');
    sheet.className = 'bnsheet';
    sheet.innerHTML =
      '<div class="bnpanel" role="menu">'+
        '<div class="bngrab"></div>'+
        '<p class="bntitle">เมนูทั้งหมด</p>'+
        '<div class="bnlist">'+
          links.map(function(a){
            return '<a href="'+a.getAttribute('href')+'" class="bnrow'+(a.classList.contains('on')?' on':'')+'" role="menuitem">'+
              iconOf(a)+'<span>'+labelOf(a)+'</span></a>';
          }).join('')+
        '</div>'+
      '</div>';
    document.body.appendChild(sheet);

    var moreBtn = document.getElementById('bnMore');
    function open(){ sheet.classList.add('on'); moreBtn.setAttribute('aria-expanded','true'); }
    function close(){ sheet.classList.remove('on'); moreBtn.setAttribute('aria-expanded','false'); }
    moreBtn.addEventListener('click', function(e){ e.stopPropagation(); sheet.classList.contains('on')?close():open(); });
    sheet.addEventListener('click', function(e){ if(e.target===sheet) close(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') close(); });
    // ถ้าเมนูที่กำลังเปิดอยู่ไม่ได้อยู่ใน 4 อันแรก ให้ปุ่มอื่นๆ ติดสถานะแทน
    if(rest.some(function(a){ return a.classList.contains('on'); })) moreBtn.classList.add('on');
  }
})();
</script>


<!-- ===== คลิกทั้งแถวเพื่อเปิดรายละเอียด (ใส่ร่วมทุกหน้าโดยสคริปต์บิลด์) ===== -->
<style>
.rowlink{cursor:pointer}
.rowlink:focus-visible{outline:2.5px solid var(--maz-red);outline-offset:-2px}
</style>
<script>
(function(){
  // ปุ่มหลักของแถวคือปุ่มแรกที่ผูกข้อมูลไว้ ปุ่มรองอย่าง "แก้ไข" ไม่นับ
  var SEL='button[data-id],button[data-q],button[data-no],button[data-run],button[data-m]';
  function primary(host){
    var b=host.querySelector(SEL);
    return (b && !b.disabled) ? b : null;
  }
  function hostOf(el){
    return el.closest('.scroll table tbody tr, .ecard, .col .ecard');
  }
  function mark(){
    var list=document.querySelectorAll('.scroll table tbody tr, .ecard');
    Array.prototype.forEach.call(list, function(r){
      var on=!!primary(r);
      if(on){
        r.classList.add('rowlink');
        if(!r.getAttribute('tabindex')) r.setAttribute('tabindex','0');
      }else{
        r.classList.remove('rowlink');
        r.removeAttribute('tabindex');
      }
    });
  }

  function open(host, ev){
    var b=primary(host); if(!b) return;
    ev.preventDefault();
    b.click();
  }

  document.addEventListener('click', function(ev){
    // กดที่ปุ่ม ลิงก์ หรือช่องกรอกในแถว ให้ทำงานของมันเอง ไม่ต้องเปิดรายละเอียด
    if(ev.target.closest('button,a,input,select,textarea,label')) return;
    var host=hostOf(ev.target); if(!host) return;
    open(host, ev);
  });

  // ใช้คีย์บอร์ดได้ด้วย ไม่ใช่เมาส์อย่างเดียว
  document.addEventListener('keydown', function(ev){
    if(ev.key!=='Enter' && ev.key!==' ') return;
    var host=ev.target.classList && ev.target.classList.contains('rowlink') ? ev.target : null;
    if(!host) return;
    open(host, ev);
  });

  var timer=null;
  function later(){ clearTimeout(timer); timer=setTimeout(mark, 30); }
  if(window.MutationObserver){
    new MutationObserver(later).observe(document.body, {childList:true, subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', mark);
  else mark();
})();
</script>

    var list=document.querySelectorAll('.scroll table tbody tr, .ecard, .erow');
    Array.prototype.forEach.call(list, function(r){
      var on=!!primary(r);
      if(on){
        r.classList.add('rowlink');
        if(!r.getAttribute('tabindex')) r.setAttribute('tabindex','0');
      }else{
        r.classList.remove('rowlink');
        r.removeAttribute('tabindex');
      }
    });
  }

  function open(host, ev){
    var b=primary(host); if(!b) return;
    ev.preventDefault();
    if(b===host){ host.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; }
    b.click();
  }

  document.addEventListener('click', function(ev){
    // กดที่ปุ่ม ลิงก์ หรือช่องกรอกในแถว ให้ทำงานของมันเอง ไม่ต้องเปิดรายละเอียด
    if(ev.target.closest('button,a,input,select,textarea,label')) return;
    var host=hostOf(ev.target); if(!host) return;
    if(host.hasAttribute('data-rowopen')) return;   // หน้านั้นดักคลิกเอง
    open(host, ev);
  });

  // ใช้คีย์บอร์ดได้ด้วย ไม่ใช่เมาส์อย่างเดียว
  document.addEventListener('keydown', function(ev){
    if(ev.key!=='Enter' && ev.key!==' ') return;
    var host=ev.target.classList && ev.target.classList.contains('rowlink') ? ev.target : null;
    if(!host) return;
    open(host, ev);
  });

  var timer=null;
  function later(){ clearTimeout(timer); timer=setTimeout(mark, 30); }
  if(window.MutationObserver){
    new MutationObserver(later).observe(document.body, {childList:true, subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', mark);
  else mark();
})();
</script>

  function open(host, ev){

  document.addEventListener('click', function(ev){

    if(ev.target.closest('button,a,input,select,textarea,label')) return;

    if(host.hasAttribute('data-rowopen')) return;   // หน้านั้นดักคลิกเอง

  document.addEventListener('keydown', function(ev){
    if(ev.key!=='Enter' && ev.key!==' ') return;
    var host=ev.target.classList && ev.target.classList.contains('rowlink') ? ev.target : null;
    if(!host) return;
    open(host, ev);
  });

  var timer=null;
  function later(){ clearTimeout(timer); timer=setTimeout(mark, 30); }
  if(window.MutationObserver){
    new MutationObserver(later).observe(document.body, {childList:true, subtree:true});
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', mark);
  else mark();
})();
</script>

               color:var(--maz-red);font-weight:600;padding:4px 6px}

</div>

<script>
(function(){
  var TODAY=PM_TODAY;
  var MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  var WD=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function pad(n){ return n<10?'0'+n:''+n; }
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parse(s){ var p=String(s).split(' ')[0].split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
  function th(iso){ if(!iso) return '—'; var d=parse(iso); return d.getDate()+' '+MON[d.getMonth()]+' '+(d.getFullYear()+543); }
  function days(a,b){ return Math.round((parse(b)-parse(a))/86400000); }
  var NOW=ymd(TODAY), filter='recv', q='', sel=null, files=[], sendMode=false;

  // TODO: ตัวตนจริงมาจากบัญชีที่ล็อกอิน ตอนนี้อ่านจาก EMP_ME
  var me=pmEmp(EMP_ME) || {id:EMP_ME, name:EMP_ME, pos:''};
  function ini(n){ var p2=String(n).split(' ');
    return (p2[0]||'').charAt(0)+(p2[1]||'').charAt(0); }
  function first(n){ return String(n).split(' ')[0]; }
  document.getElementById('avTop').textContent=ini(me.name);
  document.getElementById('avMenu').textContent=ini(me.name);
  document.getElementById('meName').textContent=me.name;
  document.getElementById('mePos').textContent=hrPos(me.pos).label;
  document.getElementById('tkHi').textContent='สวัสดี, '+first(me.name);
  document.getElementById('tkDay').textContent='วัน'+WD[TODAY.getDay()];
  document.getElementById('tkDate').textContent=th(NOW);

  function stOf(x){ return x.t.status||'todo'; }
  /* ขั้นของงานตามเหตุการณ์จริง */
  function stage(x){
    var st=stOf(x);
    if(st==='done')   return 'done';
    if(st==='revise') return 'revise';
    if(st==='sent')   return 'sent';
    return 'recv';
  }
  var STAGE_ICON={
    recv:'<path d="M4 13h4l1.5 3h5L16 13h4"/><path d="M5.5 5h13L20 13v6H4v-6z"/>',
    sent:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    revise:'<path d="M15.5 5.5l3 3L9 18H6v-3z"/><path d="M13.5 7.5l3 3"/>',
    done:'<circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/>'
  };
  var STAGE_CLS={recv:'tk-c1', sent:'tk-c2', revise:'tk-c3', done:'tk-c4'};
  function boss(){ var e=pmEmp(PM_ME.id); return e?e.name:'PM'; }   // ผู้มอบหมาย
  function nowStamp(){ var d=new Date(); return NOW+' '+pad(d.getHours())+':'+pad(d.getMinutes()); }
  function thTime(stamp){
    var p2=String(stamp).split(' ');
    return th(p2[0])+(p2[1]?' '+p2[1]+' น.':'');
  }
  function subState(x, isLast){
    // รอบก่อนหน้าในประวัติ: เป็นเหตุการณ์ที่จบไปแล้ว ใช้คำอดีตและสีกลาง ไม่ให้อ่านว่ายังค้างต้องแก้
    if(!isLast) return {c:'s-todo', t:'ตีกลับให้แก้'};
    var st=stOf(x);
    if(st==='done')   return {c:'s-done',   t:'ผ่านแล้ว'};
    if(st==='revise') return {c:'s-revise', t:'ต้องแก้ไข'};
    return {c:'s-sent', t:'รอตรวจสอบ'};
  }
  function subFiles(sb){
    if(sb.files && sb.files.length) return sb.files;
    return sb.file ? String(sb.file).split(' และ ') : [];
  }

  function mine(){
    var out=[];
    PM_PROJECTS.forEach(function(p){
      (p.tasks||[]).forEach(function(t){
        if((t.whos||[]).indexOf(EMP_ME)<0) return;
        out.push({p:p, t:t, key:p.deal+'|'+t.name});
      });
    });
    return out.sort(function(a,b){ return a.t.due<b.t.due?-1:1; });
  }
  function shown(){
    return mine().filter(function(x){
      if(stage(x)!==filter) return false;
      if(q && (x.t.name+' '+x.p.cus).toLowerCase().indexOf(q)<0) return false;
      return true;
    });
  }
  function byKey(k){ var l=mine();
    for(var i=0;i<l.length;i++) if(l[i].key===k) return l[i];
    return null; }

  // ---------- การ์ดภาพรวม = ตัวแยกขั้นของงาน ----------
  function counts(){
    var l=mine();
    function n(g){ return l.filter(function(x){ return stage(x)===g; }).length; }
    document.getElementById('fRecv').textContent=n('recv');
    document.getElementById('fSent').textContent=n('sent');
    document.getElementById('fRevise').textContent=n('revise');
    document.getElementById('fDone').textContent=n('done');
  }

  // ---------- รายการงาน ----------
  function whenLine(x){
    var subs=x.t.subs||[];
    // งานเสร็จแล้ว: บอกวันที่ PM อนุมัติ ไม่ใช่วันที่ส่ง
    // TODO: วันอนุมัติต้องอ่านจากผลการตรวจของ PM (ตาราง task_review) ตอนนี้ใช้ x.t.approvedAt จากข้อมูลสมมติ
    if(stage(x)==='done') return {t:x.t.approvedAt ? 'อนุมัติเมื่อ '+thTime(x.t.approvedAt) : 'อนุมัติแล้ว', late:false};
    if(subs.length) return {t:'ส่งเมื่อ '+thTime(subs[subs.length-1].at), late:false};
    var over=days(x.t.due, NOW);
    // นับเลยกำหนดเฉพาะงานที่ยังไม่ได้ส่ง งานที่ PM ปิดไปแล้วไม่นับ
    if(stage(x)==='recv' && over>0) return {t:'เลยกำหนด '+over+' วัน', late:true};
    return {t:'กำหนดส่ง '+th(x.t.due), late:false};
  }
  function drawList(){
    var l=shown();
    document.getElementById('wlist').innerHTML = l.length ? l.map(function(x){
      var w=whenLine(x), g=stage(x);
      var canSend=g==='recv' || g==='revise';
      return '<div class="tk-row" data-k="'+esc(x.key)+'">'+
        '<button type="button" class="tk-rhit" data-open="1" aria-label="ดูรายละเอียด '+esc(x.t.name)+'"></button>'+
        '<span class="tk-thumb '+STAGE_CLS[g]+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
          'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+STAGE_ICON[g]+'</svg></span>'+
        '<span class="tk-rtx">'+
          '<span class="tk-rname">'+esc(x.t.name)+'</span>'+
          '<span class="tk-rdesc">'+esc(x.t.brief||'')+'</span>'+
          '<span class="tk-rwhen'+(w.late?' tk-late':'')+'">'+esc(w.t)+'</span>'+
        '</span>'+
        '<span class="tk-rside">'+esc(x.p.cus)+'</span>'+
        (canSend?'<button type="button" class="tk-rsend" data-send="1">'+(g==='revise'?'ส่งแก้ไข':'ส่งงาน')+'</button>':'')+
      '</div>';
    }).join('') : '<p class="tk-empty">ไม่มีงานในกลุ่มนี้</p>';
    counts();
  }

  // ---------- รายละเอียดงาน ----------
  function fileRow(f){
    var nm = (f && f.n) ? f.n : String(f);
    var sz = (f && f.sz) ? f.sz : '';
    return '<li><span class="fic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" '+
      'stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+
      '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'+
      '</svg></span><span class="fnm2"><b>'+esc(nm)+'</b>'+
      (sz?'<em>'+esc(sz)+'</em>':'')+'</span>'+
      '<a href="#" data-dl="'+esc(nm)+'">ดาวน์โหลด</a></li>';
  }
  function drawDetail(){
    var el=document.getElementById('wdetail');
    var x=sel?byKey(sel):null;
    if(!x){ el.innerHTML=''; return; }
    // ดูรายละเอียด: หัวกล่องคือชื่อโปรเจค งานอยู่ในรายละเอียด / ส่งงาน: หัวกล่องคือชื่องานตามเดิม
    document.getElementById('tkVTitle').textContent=sendMode ? x.t.name : x.p.cus;
    var late=stage(x)==='recv' && days(x.t.due, NOW)>0;
    var subs=(x.t.subs||[]).slice().reverse();
    var revise=stage(x)==='revise';
    var canSend=stage(x)==='recv' || revise;

    var h='';
    // เปิดจากปุ่มส่งงาน: ไม่แสดงรายละเอียดงานและไฟล์จาก PM
    // ดูรายละเอียด: ชื่องาน → คำอธิบายต่อท้าย → ไฟล์จาก PM → ผู้มอบหมาย/กำหนดส่ง
    // ดูรายละเอียดของงานรอ PM ตรวจ และงานที่ต้องแก้ไข: ไม่แสดงรายละเอียดงาน
    var reviseView=revise && !sendMode;   // งานที่ต้องแก้ไข: มีแค่ความคิดเห็นจาก PM
    var doneView=stage(x)==='done' && !sendMode;   // งานเสร็จแล้ว: มีแค่เนื้อหาประวัติการส่งงาน
    if(!sendMode && stage(x)!=='sent' && !reviseView && !doneView){
      h+='<section class="dsec tk-info" aria-label="รายละเอียดงาน">'+
        '<p class="tk-taskname">'+esc(x.t.name)+'</p>'+
        '<p class="dtext tk-brief">'+
          (x.t.brief ? esc(x.t.brief) : '<span class="dnone">ยังไม่มีรายละเอียดเพิ่มเติมจาก PM</span>')+
        '</p>'+
        // TODO: ไฟล์จาก PM ต้องอ่านจากตาราง task_file ตอนนี้ยังไม่มีข้อมูลจริง
        '<p class="tk-kvlabel">ไฟล์จาก PM</p>'+
        ((x.t.files||[]).length
          ? '<ul class="dfiles">'+x.t.files.map(fileRow).join('')+'</ul>'
          : '<p class="dnone">ไม่มีไฟล์แนบ</p>')+
        '<dl class="dkv tk-kvafter">'+
          '<div><dt>ผู้มอบหมาย</dt><dd>'+esc(boss())+'</dd></div>'+
          '<div><dt>กำหนดส่ง</dt><dd'+(late?' class="late4"':'')+'>'+esc(th(x.t.due))+'</dd></div>'+
        '</dl>'+
      '</section>';
    }

    // เปิดจากปุ่มส่งงาน/ส่งแก้ไข: มีแค่ฟอร์ม ไม่แสดงผลงาน ความคิดเห็น หรือประวัติ
    if(subs.length && !reviseView && !doneView && !sendMode){
      var last=subs[0], lst=subState(x, true), lf=subFiles(last);
      var isSent=stage(x)==='sent';
      var filesHtml='<ul class="dfiles'+(isSent?' tk-sentfiles':'')+'">'+(lf.length
            ? lf.map(function(n){ return fileRow({n:n}); }).join('')
            : '<li><span class="dnone">ไม่ได้แนบไฟล์</span></li>')+'</ul>';
      var kvHtml='<dl class="dkv"'+(isSent?'':' style="margin-top:14px"')+'>'+
            '<div><dt>ส่งเมื่อ</dt><dd>'+esc(thTime(last.at))+'</dd></div>'+
            '<div><dt>สถานะ</dt><dd><span class="wst '+lst.c+'">'+esc(lst.t)+'</span></dd></div>'+
            // บอกรอบเฉพาะเมื่อเคยส่งแก้แล้ว (มากกว่า 1 รอบ)
            (subs.length>1?'<div><dt>รอบที่</dt><dd>'+subs.length+'</dd></div>':'')+
          '</dl>';
      var noteHtml=last.note?'<p class="dtext'+(isSent?' tk-sentnote':'')+'" style="margin-top:'+(isSent?'6':'14')+'px">'+esc(last.note)+'</p>':'';
      // งานรอ PM ตรวจ: ไม่มีหัวข้อ "ผลงานที่ส่ง" เพราะป็อปอัพมีแค่ส่วนนี้
      h += '<section class="dsec" aria-label="ผลงานที่ส่ง">'+(stage(x)==='sent'?'':'<h3>ผลงานที่ส่ง</h3>')+
        // งานรอ PM ตรวจ: ไม่มีกรอบครอบ เรียง ส่งเมื่อ/สถานะ → ไฟล์ที่ส่ง → หมายเหตุใต้ไฟล์
        '<div class="subcard'+(isSent?' tk-plain':'')+'">'+
          (isSent ? kvHtml+filesHtml+noteHtml : filesHtml+kvHtml+noteHtml)+
        '</div></section>';
    }

    if(revise && x.t.back && !sendMode)
      h += '<div class="dback"><h4>ความคิดเห็นจาก PM</h4><p>'+esc(x.t.back.why)+'</p>'+
        '<em>'+esc(th(x.t.back.at))+'</em></div>';

    // ฟอร์มแนบไฟล์ส่งงานมีเฉพาะตอนเปิดจากปุ่มส่งงานในกล่องงาน
    if(canSend && sendMode){
      // ส่งแก้ไข: ไม่มีหัวข้อ มีแค่ช่องแนบไฟล์ หมายเหตุ และปุ่ม
      h += '<section class="dsec" aria-label="'+(revise?'ส่งแก้ไข':'ส่งงาน')+'">'+(revise?'':'<h3>ส่งงาน</h3>')+

  // ---------- ไฟล์ที่แนบส่งงาน ----------
  // files: [{name, size, loaded, timer}]  โหลดครบเมื่อ loaded===size
  function fmtSize(n){
    if(n<1024) return n+' B';
    if(n<1048576) return Math.round(n/1024)+' KB';
    if(n<1073741824) return (n/1048576).toFixed(n<10485760?1:0)+' MB';
    return (n/1073741824).toFixed(1)+' GB';
  }
  function extOf(name){
    var m=/\.([A-Za-z0-9]{1,5})$/.exec(name);
    return m ? m[1].toUpperCase().slice(0,4) : 'FILE';
  }
  function busy(f){ return f.loaded<f.size; }
  var TRASH='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+
    '<path d="M4 7h16"/><path d="M9.5 7V4.5h5V7"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5.5M14 11v5.5"/></svg>';
  var CROSS='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
  function sizeText(f){ return busy(f) ? fmtSize(f.loaded)+' จาก '+fmtSize(f.size) : fmtSize(f.size); }
  function drawPicked(){
    var el=document.getElementById('picked'); if(!el) return;
    el.innerHTML=files.map(function(f,i){
      var b=busy(f);
      return '<li class="tk-file'+(b?' tk-busy':'')+'" data-i="'+i+'">'+
        '<span class="tk-ftype">'+esc(extOf(f.name))+'</span>'+
        '<span class="tk-fmeta"><b>'+esc(f.name)+'</b><em>'+esc(sizeText(f))+'</em></span>'+
        '<button type="button" class="tk-fbtn" data-x="'+i+'" aria-label="'+(b?'ยกเลิกการอัปโหลด':'ลบไฟล์')+'">'+(b?CROSS:TRASH)+'</button>'+
        (b?'<span class="tk-prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+
          Math.round(f.loaded/f.size*100)+'"><i style="width:'+(f.loaded/f.size*100)+'%"></i></span>':'')+
      '</li>';
    }).join('');
  }
  function tickRow(f){
    var i=files.indexOf(f); if(i<0) return;
    var li=document.querySelector('#picked li[data-i="'+i+'"]'); if(!li) return;
    li.querySelector('em').textContent=sizeText(f);
    var bar=li.querySelector('.tk-prog');
    if(bar){ bar.setAttribute('aria-valuenow', Math.round(f.loaded/f.size*100));
             bar.firstChild.style.width=(f.loaded/f.size*100)+'%'; }
  }
  function stopAll(){ files.forEach(function(f){ if(f.timer) clearInterval(f.timer); }); files=[]; }
  function addFiles(list){
    for(var i=0;i<list.length;i++){
      var f={name:list[i].name, size:Math.max(1,list[i].size||1), loaded:0, timer:null};
      files.push(f); startUpload(f);
    }
    document.getElementById('sWarn').classList.add('hide');
    drawPicked();
  }
  /* TODO: ⚠️ อัปโหลดจำลอง ของจริงต้องอัปขึ้นที่เก็บไฟล์ (Supabase Storage) แล้วอ่านความคืบหน้าจาก event ของการอัปโหลด */
  function startUpload(f){
    var steps=18+Math.floor(Math.random()*14);
    f.timer=setInterval(function(){
      f.loaded=Math.min(f.size, f.loaded+Math.ceil(f.size/steps));
      if(f.loaded>=f.size){ clearInterval(f.timer); f.timer=null; drawPicked(); }
      else tickRow(f);
    }, 110);
  }

  // ---------- กล่องรายละเอียด ----------
  var tk=document.getElementById('tkVeil'), lastRow=null, lastSend=false, lastByKey=false;
  function openTk(k, toSend, byKey){
    lastByKey=!!byKey;
    sel=k; sendMode=!!toSend; drawDetail();
    tk.classList.add('on');
    var body=tk.querySelector('.bbody'), drop=document.getElementById('drop');
    body.scrollTop=0;
    if(toSend && drop){
      // เลื่อนลงไปที่ส่วนส่งงานโดยตรง
      body.scrollTop=drop.parentNode.getBoundingClientRect().top-body.getBoundingClientRect().top-8;
    }
    // กล่องยัง visibility:hidden ระหว่างเริ่ม transition จึงต้องรอให้แสดงก่อนค่อยย้าย focus
    setTimeout(function(){
      if(!tk.classList.contains('on')) return;
      // เปิดด้วยเมาส์: ย้าย focus เข้ากล่องเฉยๆ ไม่ให้ปุ่มไหนเปลี่ยนสีเอง
      // เปิดด้วยคีย์บอร์ด: ไปที่ช่องวางไฟล์หรือปุ่มปิด ให้เห็นว่าอยู่ตรงไหน
      var t=byKey ? ((toSend && document.getElementById('drop')) || document.getElementById('tkVClose'))
                  : tk.querySelector('.tk-box');
      t.focus({preventScroll:true});
    }, 200);
  }
  function closeTk(){
    stopAll();
    tk.classList.remove('on'); sel=null;
    if(lastRow){
      var row=document.querySelector('.tk-row[data-k="'+lastRow.replace(/"/g,'\\"')+'"]');
      var b=row && row.querySelector(lastSend && row.querySelector('.tk-rsend') ? '.tk-rsend' : '.tk-rhit');
      if(b){ b.focus(); return; }
      // งานย้ายกลุ่มไปแล้ว (เช่นเพิ่งส่ง): คนใช้คีย์บอร์ดให้ focus ไปที่งานถัดไป หรือการ์ดกลุ่มที่เลือกอยู่
      if(lastByKey){

        if(nx) nx.focus();

  // เลื่อนลงไปที่รายการงาน โดยเว้นระยะหัวหน้าที่ติดอยู่ด้านบน
  function scrollToList(){
    var main=document.querySelector('main.main'), list=document.getElementById('wlist');
    // หัวที่ติดด้านบน: บนคอมคือหัวหน้า บนมือถือคือแถบปุ่มแคปซูล ใช้ตัวที่แสดงอยู่
    var head=null, cands=[document.querySelector('.mh-top'), document.querySelector('.tk-head')];
    for(var hi=0;hi<cands.length;hi++) if(cands[hi] && cands[hi].offsetHeight>0){ head=cands[hi]; break; }
    var off=(head?head.offsetHeight:0)+16;
    // รายการสั้นจะเลื่อนขึ้นไม่ถึงใต้หัวหน้า ให้พื้นที่รายการสูงอย่างน้อยเท่าจอที่เหลือ
    var bnH=0, bars=[document.querySelector('.mh-tab'), document.querySelector('.botnav')];
    for(var bi=0;bi<bars.length;bi++) if(bars[bi] && getComputedStyle(bars[bi]).display!=='none'){ bnH=bars[bi].offsetHeight; break; }
    list.style.minHeight=Math.max(0, main.clientHeight-off-bnH-16)+'px';
    var top=list.getBoundingClientRect().top-main.getBoundingClientRect().top+main.scrollTop-off;
    var smooth=!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    if(main.scrollTo) main.scrollTo({top:Math.max(0,top), behavior:smooth?'smooth':'auto'});
    else main.scrollTop=Math.max(0,top);
  }
